spring.profiles.active=${ACTIVE_PROFILE:dev}
ui.app.url=${UI_APP_URL}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.schema=desporto24
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
desporto.app.jwtCookieName=desporto
desporto.app.jwtSecret=${JWT_SECRET}
desporto.app.jwtExpirationMs=3600000
jwt.secret='[a-zA-Z0-9._]^+$Guidelines89797987forAlphabeticalArraNumeralsandOtherSymbo$'
spring.main.allow-circular-references=true
server.port=${CONTAINER_PORT:8080}
mail.verify.host=${VERIFY_EMAIL_HOST}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always


#remove after removing AesEncryptor.java
aes.encryption.key=4elxod
