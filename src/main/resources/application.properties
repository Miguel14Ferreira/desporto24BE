spring.profiles.active=${ACTIVE_PROFILE:dev}
ui.app.url=${UI_APP_URL}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.schema=${POSTGRES_SCHEMA:desporto24}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/runtime/001_schema_compatibility.sql
spring.sql.init.data-locations=classpath:db/runtime/002_fixed_venues.sql,classpath:db/runtime/003_venue_sport_classifications.sql,classpath:db/runtime/004_reference_catalogs.sql,classpath:db/runtime/005_backfill_venue_sports.sql
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
desporto.app.jwtCookieName=desporto
desporto.app.jwtSecret=${JWT_SECRET}
desporto.app.jwtExpirationMs=${JWT_EXPIRATION_MS:1800000}
desporto.app.refreshExpirationMs=${REFRESH_EXPIRATION_MS:604800000}
desporto.preview-mode=${DESPORTO_PREVIEW_MODE:false}
desporto.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${UI_APP_URL}}
spring.main.allow-circular-references=true
server.port=${PORT:${CONTAINER_PORT:8080}}
mail.verify.host=${VERIFY_EMAIL_HOST}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always


#remove after removing AesEncryptor.java
aes.encryption.key=${AES_ENCRYPTION_KEY}

desporto.reliability.free-cancel-hours=2
desporto.reliability.lookback-days=90
desporto.reliability.late-cancellation-weight=0.5
desporto.reliability.no-show-weight=1.0
desporto.reliability.warning-threshold=2.0
desporto.reliability.reduced-priority-threshold=3.0
desporto.reliability.restriction-threshold=4.0
desporto.reliability.restriction-days=7
desporto.reliability.attendance-marking-delay-minutes=30

desporto.media.provider=${MEDIA_PROVIDER:local}
desporto.media.local-root=${MEDIA_LOCAL_ROOT:./data/media}
desporto.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
desporto.media.s3.bucket=${MEDIA_S3_BUCKET:}
desporto.media.s3.region=${MEDIA_S3_REGION:auto}
desporto.media.s3.endpoint=${MEDIA_S3_ENDPOINT:}
desporto.media.s3.access-key=${MEDIA_S3_ACCESS_KEY:}
desporto.media.s3.secret-key=${MEDIA_S3_SECRET_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true


desporto.google.client-id=${GOOGLE_CLIENT_ID:}
