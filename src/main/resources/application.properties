spring.profiles.active=${ACTIVE_PROFILE:dev}
ui.app.url=${UI_APP_URL}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
desporto.app.jwtCookieName= desporto
desporto.app.jwtSecret=${JWT_SECRET}
desporto.app.jwtExpirationMs=3600000
jwt.secret='[a-zA-Z0-9._]^+$Guidelines89797987forAlphabeticalArraNumeralsandOtherSymbo$'
spring.main.allow-circular-references=true
server.port=${CONTAINER_PORT:8080}
server.error.whitelabel.enabled=false
mail.verify.host=${VERIFY_EMAIL_HOST}
