spring.config.import=file:/etc/secrets/r2.properties
# Production profile.
# Environment-specific infrastructure values must be supplied at runtime.

# Defer non-essential bean creation so constrained production/preview instances
# can bind the HTTP port sooner during startup.
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy

# Production media must use durable object storage. Never silently fall back to
# the ephemeral Render filesystem.
desporto.media.provider=s3

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.liquibase.default-schema=${DB_SCHEMA:public}
spring.liquibase.liquibase-schema=${DB_SCHEMA:public}

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

management.endpoint.health.show-details=never

# Read-only SNID coverage check after application readiness; no database writes.
desporto.venues.snid.validate-on-ready=${SNID_VALIDATE_ON_READY:true}
