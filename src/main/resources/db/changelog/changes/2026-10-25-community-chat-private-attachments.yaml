databaseChangeLog:
  - changeSet:
      id: 2026-10-25-community-chat-private-attachments
      author: desporto24
      comment: "Optional private CHAT-only attachments. Community POST image/video storage remains unchanged."
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_timeline_entry
            columns:
              - column: { name: attachment_key, type: VARCHAR(240) }
              - column: { name: attachment_name, type: VARCHAR(160) }
              - column: { name: attachment_mime_type, type: VARCHAR(60) }
              - column: { name: attachment_size, type: BIGINT }
