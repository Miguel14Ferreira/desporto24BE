databaseChangeLog:
  - changeSet:
      id: 2026-10-17-community-tournament-team-results
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament_team_match
            columns:
              - column:
                  name: home_score
                  type: INT
              - column:
                  name: away_score
                  type: INT
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE desporto24.community_tournament_team_match
              ADD CONSTRAINT ck_team_match_scores_consistent
              CHECK (
                (status = 'SCHEDULED' AND home_score IS NULL AND away_score IS NULL AND completed_at IS NULL)
                OR
                (status = 'COMPLETED' AND home_score BETWEEN 0 AND 999
                  AND away_score BETWEEN 0 AND 999 AND completed_at IS NOT NULL)
              );
