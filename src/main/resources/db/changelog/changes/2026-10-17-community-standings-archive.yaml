databaseChangeLog:
  - changeSet:
      id: 2026-10-17-community-standings-archive
      author: desporto24
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_standings_archive
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: season_id
                  type: BIGINT
              - column:
                  name: title
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: entry_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: source_filename
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_by_username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createTable:
            schemaName: desporto24
            tableName: community_standings_archive_row
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: archive_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: normalized_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: played
                  type: INT
              - column:
                  name: wins
                  type: INT
              - column:
                  name: draws
                  type: INT
              - column:
                  name: losses
                  type: INT
              - column:
                  name: points
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: goals_for
                  type: INT
              - column:
                  name: goals_against
                  type: INT
        - addForeignKeyConstraint:
            constraintName: fk_archive_community
            baseTableSchemaName: desporto24
            baseTableName: community_standings_archive
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_archive_season
            baseTableSchemaName: desporto24
            baseTableName: community_standings_archive
            baseColumnNames: season_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_season
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_archive_row_archive
            baseTableSchemaName: desporto24
            baseTableName: community_standings_archive_row
            baseColumnNames: archive_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_standings_archive
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_standings_archive_row
            columnNames: archive_id, normalized_name
            constraintName: uk_archive_row_name
        - createIndex:
            schemaName: desporto24
            tableName: community_standings_archive
            indexName: idx_archive_community_created
            columns:
              - column:
                  name: community_id
              - column:
                  name: created_at
        - createIndex:
            schemaName: desporto24
            tableName: community_standings_archive_row
            indexName: idx_archive_row_archive_position
            columns:
              - column:
                  name: archive_id
              - column:
                  name: position
