databaseChangeLog:
  - changeSet:
      id: 2026-10-16-community-multiple-sports
      author: desporto24
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_sport
            columns:
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: sport
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            schemaName: desporto24
            tableName: community_sport
            columnNames: community_id, position
            constraintName: pk_community_sport
        - addForeignKeyConstraint:
            constraintName: fk_community_sport_community
            baseTableSchemaName: desporto24
            baseTableName: community_sport
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            onDelete: CASCADE
        # Backfill all existing communities without modifying the original sport.
        - sql:
            dbms: postgresql
            sql: >-
              INSERT INTO desporto24.community_sport (community_id, position, sport)
              SELECT id, 0, BTRIM(sport)
              FROM desporto24.community
              WHERE NULLIF(BTRIM(sport), '') IS NOT NULL;
