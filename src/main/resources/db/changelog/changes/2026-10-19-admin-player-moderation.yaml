databaseChangeLog:
  - changeSet:
      id: 2026-10-19-admin-player-moderation
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: profile
            columns:
              - column:
                  name: moderation_suspended_at
                  type: TIMESTAMP WITH TIME ZONE
        - createTable:
            schemaName: desporto24
            tableName: admin_player_moderation_audit
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: desporto24
            tableName: admin_player_moderation_audit
            indexName: idx_admin_player_moderation_target
            columns:
              - column:
                  name: target_id
              - column:
                  name: occurred_at
