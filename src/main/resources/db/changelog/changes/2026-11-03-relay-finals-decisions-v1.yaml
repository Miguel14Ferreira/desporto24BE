databaseChangeLog:
  - changeSet:
      id: 2026-11-03-relay-finals-decisions-v1
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament
            columns:
              - column:
                  name: relay_final_published_at
                  type: TIMESTAMP WITH TIME ZONE
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament_relay_heat
            columns:
              - column:
                  name: stage
                  type: VARCHAR(20)
                  defaultValue: QUALIFICATION
                  constraints:
                    nullable: false
              - column:
                  name: decision_status
                  type: VARCHAR(20)
                  defaultValue: VALID
                  constraints:
                    nullable: false
        - dropUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament_relay_heat
            constraintName: uk_tournament_relay_heat
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament_relay_heat
            columnNames: tournament_id, team_id, stage, heat_number
            constraintName: uk_tournament_relay_stage_heat
        - createTable:
            schemaName: desporto24
            tableName: community_tournament_relay_finalist
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tournament_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: team_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: seed
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: qualifying_seconds
                  type: DECIMAL(11,3)
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament_relay_finalist
            columnNames: tournament_id, team_id
            constraintName: uk_tournament_relay_finalist
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_relay_finalist
            baseColumnNames: tournament_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament
            referencedColumnNames: id
            constraintName: fk_tournament_relay_finalist_tournament
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_relay_finalist
            baseColumnNames: team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament_team
            referencedColumnNames: id
            constraintName: fk_tournament_relay_finalist_team
            onDelete: CASCADE
        - createTable:
            schemaName: desporto24
            tableName: community_tournament_relay_decision
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tournament_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: heat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: previous_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: new_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: actor_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: decided_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_relay_decision
            baseColumnNames: tournament_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament
            referencedColumnNames: id
            constraintName: fk_tournament_relay_decision_tournament
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_relay_decision
            baseColumnNames: heat_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament_relay_heat
            referencedColumnNames: id
            constraintName: fk_tournament_relay_decision_heat
            onDelete: CASCADE
        - createIndex:
            schemaName: desporto24
            tableName: community_tournament_relay_decision
            indexName: idx_tournament_relay_decisions
            columns:
              - column:
                  name: tournament_id
