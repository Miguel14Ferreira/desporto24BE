databaseChangeLog:
  - changeSet:
      id: 2026-10-25-inline-speed-jury-tiebreak-revisions-v1
      author: desporto24
      changes:
        - createTable:
            tableName: community_inline_speed_tiebreak_revision
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: tiebreak_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: revision_number, type: INT, constraints: {nullable: false}}
              - column: {name: selected_player_ids, type: TEXT, constraints: {nullable: false}}
              - column: {name: source_fingerprint, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: judge_reason, type: VARCHAR(500), constraints: {nullable: false}}
              - column: {name: confirmed_by, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: confirmed_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: community_inline_speed_tiebreak_revision
            columnNames: tiebreak_id, revision_number
            constraintName: uk_inline_speed_tiebreak_revision
        - addForeignKeyConstraint:
            baseTableName: community_inline_speed_tiebreak_revision
            baseColumnNames: tiebreak_id
            referencedTableName: community_inline_speed_tiebreak
            referencedColumnNames: id
            constraintName: fk_inline_speed_tiebreak_revision
            onDelete: CASCADE
