databaseChangeLog:
  - changeSet:
      id: 2026-10-27-session-community-share
      author: desporto24
      changes:
        - createTable:
            schemaName: desporto24
            tableName: session_community_share
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: session_community_share
            baseColumnNames: session_id
            referencedTableSchemaName: desporto24
            referencedTableName: session
            referencedColumnNames: id
            constraintName: fk_session_community_share_session
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: session_community_share
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_session_community_share_community
            onDelete: CASCADE
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: session_community_share
            columnNames: session_id, community_id
            constraintName: uq_session_community_share
        - createIndex:
            schemaName: desporto24
            tableName: session_community_share
            indexName: ix_session_community_share_community
            columns:
              - column:
                  name: community_id
