databaseChangeLog:
  - changeSet:
      id: 2026-10-24-community-historical-tournament
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament
            columns:
              - column:
                  name: historical_archive_id
                  type: BIGINT
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament
            columnNames: historical_archive_id
