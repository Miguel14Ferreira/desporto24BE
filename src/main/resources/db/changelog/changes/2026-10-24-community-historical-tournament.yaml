        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament
            baseColumnNames: historical_archive_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_match_archive
            referencedColumnNames: id
            constraintName: fk_community_tournament_historical_archive
