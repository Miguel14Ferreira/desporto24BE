databaseChangeLog:
  - changeSet:
      id: 2026-10-27-community-session-round-link
      author: desporto24
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: community_round
            columnName: source_session_id
      changes:
        - addColumn:
            tableName: community_round
            columns:
              - column:
                  name: source_session_id
                  type: BIGINT
        - createIndex:
            tableName: community_round
            indexName: uq_community_round_source_session
            unique: true
            columns:
              - column:
                  name: source_session_id
