databaseChangeLog:
  - changeSet:
      id: 2026-10-25-sprint-official-two-up-award
      author: desporto24
      changes:
        - addColumn:
            tableName: community_track_sprint_incident
            columns:
              - column: { name: award_winner, type: VARCHAR(100) }
              - column: { name: award_reference, type: VARCHAR(255) }
              - column: { name: award_reason, type: VARCHAR(500) }
              - column: { name: award_confirmed_by, type: VARCHAR(100) }
              - column: { name: award_confirmed_at, type: TIMESTAMP WITH TIME ZONE }
