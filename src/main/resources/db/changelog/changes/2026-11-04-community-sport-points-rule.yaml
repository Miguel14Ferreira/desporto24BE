databaseChangeLog:
  - changeSet:
      id: 2026-11-04-community-sport-points-rule
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_sport_points_rule
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_community_sport_points_rule
                    nullable: false
              - column:
                  name: season_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sport
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: win_points
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: draw_points
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: loss_points
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_sport_points_rule
            columnNames: season_id, sport
            constraintName: uq_community_sport_points_rule_season_sport
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_sport_points_rule
            baseColumnNames: season_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_season
            referencedColumnNames: id
            constraintName: fk_community_sport_points_rule_season
            onDelete: CASCADE
