databaseChangeLog:
  - changeSet:
      id: 2026-10-23-direct-chat-reply-snapshot
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: chat
            columns:
              - column:
                  name: reply_to_message_id
                  type: BIGINT
                  remarks: "Optional message ID quoted inside the same authorized direct chat."
              - column:
                  name: reply_to_sender
                  type: VARCHAR(128)
                  remarks: "Server-owned original sender snapshot. Never from client."
              - column:
                  name: reply_to_text
                  type: VARCHAR(2000)
                  remarks: "Server-owned immutable quote snapshot for paginated history."
