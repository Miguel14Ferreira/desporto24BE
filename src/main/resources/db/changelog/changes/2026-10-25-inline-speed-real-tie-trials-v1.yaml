databaseChangeLog:
  - changeSet:
      id: 2026-10-25-inline-speed-real-tie-trials-v1
      author: desporto24
      changes:
        - createTable:
            tableName: community_inline_speed_tie_trial
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: tournament_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: source_stage, type: VARCHAR(12), constraints: {nullable: false}}
              - column: {name: source_fingerprint, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: official_reference, type: VARCHAR(500), constraints: {nullable: false}}
              - column: {name: judge_reason, type: VARCHAR(500), constraints: {nullable: false}}
              - column: {name: held_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: recorded_by, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: recorded_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - createTable:
            tableName: community_inline_speed_tie_trial_result
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: trial_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: player_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: place, type: INT, constraints: {nullable: false}}
              - column: {name: seconds, type: 'DECIMAL(9,3)'}
        - addForeignKeyConstraint:
            baseTableName: community_inline_speed_tie_trial
            baseColumnNames: tournament_id
            referencedTableName: community_tournament
            referencedColumnNames: id
            constraintName: fk_inline_speed_tie_trial_tournament
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: community_inline_speed_tie_trial_result
            baseColumnNames: trial_id
            referencedTableName: community_inline_speed_tie_trial
            referencedColumnNames: id
            constraintName: fk_inline_speed_tie_trial_result_trial
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: community_inline_speed_tie_trial_result
            columnNames: trial_id, player_id
            constraintName: uk_inline_speed_trial_player
        - addUniqueConstraint:
            tableName: community_inline_speed_tie_trial_result
            columnNames: trial_id, place
            constraintName: uk_inline_speed_trial_place
