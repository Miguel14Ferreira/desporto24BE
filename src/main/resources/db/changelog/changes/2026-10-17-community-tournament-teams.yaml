databaseChangeLog:
  - changeSet:
      id: 2026-10-17-community-tournament-teams
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament
            columns:
              - column:
                  name: entry_type
                  type: VARCHAR(16)
                  defaultValue: INDIVIDUAL
                  constraints:
                    nullable: false
              - column:
                  name: players_per_team
                  type: INT
        - createTable:
            schemaName: desporto24
            tableName: community_tournament_team
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tournament_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: normalized_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createTable:
            schemaName: desporto24
            tableName: community_tournament_team_player
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tournament_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: team_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: assigned_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament_team
            columnNames: tournament_id, normalized_name
            constraintName: uk_tournament_team_normalized_name
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament_team
            columnNames: tournament_id, id
            constraintName: uk_tournament_team_scope
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament_team_player
            columnNames: tournament_id, profile_id
            constraintName: uk_tournament_team_player_one_team
        - addForeignKeyConstraint:
            constraintName: fk_tournament_team_tournament
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_team
            baseColumnNames: tournament_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_tournament_team_player_tournament
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_team_player
            baseColumnNames: tournament_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_tournament_team_player_team
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_team_player
            baseColumnNames: team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament_team
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_tournament_team_player_profile
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_team_player
            baseColumnNames: profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
        - createIndex:
            schemaName: desporto24
            tableName: community_tournament_team_player
            indexName: idx_tournament_team_player_team
            columns:
              - column:
                  name: team_id
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE desporto24.community_tournament
              ADD CONSTRAINT ck_tournament_entry_type CHECK (entry_type IN ('INDIVIDUAL', 'TEAM')),
              ADD CONSTRAINT ck_tournament_team_size CHECK (
                (entry_type = 'INDIVIDUAL' AND players_per_team IS NULL)
                OR (entry_type = 'TEAM' AND players_per_team BETWEEN 1 AND 30)
              );
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE desporto24.community_tournament_team_player
              ADD CONSTRAINT fk_tournament_team_player_scope
              FOREIGN KEY (tournament_id, team_id)
              REFERENCES desporto24.community_tournament_team(tournament_id, id);
