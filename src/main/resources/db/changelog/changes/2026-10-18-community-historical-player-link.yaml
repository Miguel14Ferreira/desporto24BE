databaseChangeLog:
  - changeSet:
      id: 2026-10-18-community-historical-player-link
      author: desporto24
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_historical_player_link
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: community_player_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: proposed_by_username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: confirmed_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            constraintName: fk_hist_link_community
            baseTableSchemaName: desporto24
            baseTableName: community_historical_player_link
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_hist_link_player
            baseTableSchemaName: desporto24
            baseTableName: community_historical_player_link
            baseColumnNames: community_player_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_player
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_hist_link_profile
            baseTableSchemaName: desporto24
            baseTableName: community_historical_player_link
            baseColumnNames: profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_historical_player_link
            columnNames: community_player_id
            constraintName: uk_community_historical_player_link
        - createIndex:
            schemaName: desporto24
            tableName: community_historical_player_link
            indexName: idx_hist_link_target_status
            columns:
              - column:
                  name: community_id
              - column:
                  name: profile_id
              - column:
                  name: status
