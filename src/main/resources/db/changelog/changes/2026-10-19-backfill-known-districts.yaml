databaseChangeLog:
  # Limited backfill: NULL/blank district only, never overrides a populated district.
  - changeSet:
      id: 2026-10-19-backfill-venue-district-from-unambiguous-city
      author: jynlo-venues
      dbms: postgresql
      runInTransaction: true
      preConditions:
        onFail: HALT
        tableExists:
          schemaName: desporto24
          tableName: venue
      changes:
        - sqlFile:
            path: 2026-10-19-backfill-known-districts.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
            endDelimiter: ;
