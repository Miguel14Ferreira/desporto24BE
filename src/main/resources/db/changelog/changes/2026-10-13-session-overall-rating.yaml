databaseChangeLog:
  - changeSet:
      id: 2026-10-13-session-overall-rating
      author: desporto24
      changes:
        - addColumn:
            tableName: session_experience_rating
            columns:
              - column:
                  name: overall_score
                  type: INTEGER
        - sql:
            dbms: postgresql
            sql: |-
              UPDATE desporto24.session_experience_rating
              SET overall_score = ROUND(
                (environment_score + venue_score + game_score)::numeric / 3
              )::integer;
        - addNotNullConstraint:
            tableName: session_experience_rating
            columnName: overall_score
            columnDataType: INTEGER
        - sql:
            dbms: postgresql
            sql: |-
              ALTER TABLE desporto24.session_experience_rating
              DROP CONSTRAINT IF EXISTS ck_session_experience_rating_scores;
        - dropColumn:
            tableName: session_experience_rating
            columnName: environment_score
        - dropColumn:
            tableName: session_experience_rating
            columnName: venue_score
        - dropColumn:
            tableName: session_experience_rating
            columnName: game_score
        - sql:
            dbms: postgresql
            sql: |-
              ALTER TABLE desporto24.session_experience_rating
              ADD CONSTRAINT ck_session_experience_rating_overall
              CHECK (overall_score BETWEEN 1 AND 5);
