databaseChangeLog:
  - changeSet:
      id: 2026-10-23-community-race-steward-decisions
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_round_entry
            columns:
              - column:
                  name: race_time_penalty_seconds
                  type: NUMERIC(7,3)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: race_disqualified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: race_steward_reason
                  type: VARCHAR(255)
