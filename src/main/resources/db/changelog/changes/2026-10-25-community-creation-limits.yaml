databaseChangeLog:
  - changeSet:
      id: 2026-10-25-community-creation-limits-v1
      author: desporto24
      comment: "Owner-specific creation quota and immutable daily creation history"
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: profile
            columns:
              - column:
                  name: community_creation_limit
                  type: integer
        - createTable:
            schemaName: desporto24
            tableName: community_creation_event
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_community_creation_event
              - column:
                  name: creator_profile_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: desporto24
            tableName: community_creation_event
            indexName: idx_community_creation_event_actor_at
            columns:
              - column:
                  name: creator_profile_id
              - column:
                  name: created_at
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO desporto24.community_creation_event (creator_profile_id, created_at)
              SELECT owner_profile_id, created_at FROM desporto24.community
              WHERE owner_profile_id IS NOT NULL AND created_at IS NOT NULL;
        - createTable:
            schemaName: desporto24
            tableName: community_creation_limit_audit
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_community_creation_limit_audit
              - column:
                  name: actor_profile_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: target_profile_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: previous_limit
                  type: integer
              - column:
                  name: new_limit
                  type: integer
              - column:
                  name: reason
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE desporto24.profile
              ADD CONSTRAINT ck_profile_community_creation_limit
              CHECK (community_creation_limit IS NULL OR community_creation_limit BETWEEN 1 AND 100);
