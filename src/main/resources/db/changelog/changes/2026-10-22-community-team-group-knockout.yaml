databaseChangeLog:
  - changeSet:
      id: 2026-10-22-community-team-group-knockout
      author: desporto24
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament
            columns:
              - column:
                  name: group_count
                  type: integer
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament_team
            columns:
              - column:
                  name: group_number
                  type: integer
              - column:
                  name: group_draw_order
                  type: integer
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament_team_match
            columns:
              - column:
                  name: group_number
                  type: integer
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE desporto24.community_tournament
              DROP CONSTRAINT ck_tournament_format
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE desporto24.community_tournament
              ADD CONSTRAINT ck_tournament_format
              CHECK (format IN ('LEAGUE', 'KNOCKOUT', 'GROUP_KNOCKOUT'))
