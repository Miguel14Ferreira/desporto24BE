databaseChangeLog:
  - changeSet:
      id: 2026-10-25-sprint-official-two-up-heat-award
      author: desporto24
      changes:
        - addColumn:
            tableName: community_track_sprint_incident
            columns:
              - column: { name: award_winner_username, type: VARCHAR(100) }
