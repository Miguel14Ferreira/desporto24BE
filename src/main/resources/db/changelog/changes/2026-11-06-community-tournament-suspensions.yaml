databaseChangeLog:
  - changeSet:
      id: 2026-11-06-community-tournament-suspensions
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_tournament_suspension
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: target_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: issued_by_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: starts_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: ends_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_by_profile_id
                  type: BIGINT
              - column:
                  name: revocation_reason
                  type: VARCHAR(1000)
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_suspension
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_community_tournament_suspension_community
            onDelete: CASCADE
        - createIndex:
            schemaName: desporto24
            tableName: community_tournament_suspension
            indexName: idx_community_tournament_suspension_active
            columns:
              - column:
                  name: community_id
              - column:
                  name: target_profile_id
              - column:
                  name: ends_at
