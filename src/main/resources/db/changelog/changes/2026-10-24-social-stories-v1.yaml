databaseChangeLog:
  - changeSet:
      id: 2026-10-24-social-stories-v1
      author: desporto24
      changes:
        - createTable:
            tableName: social_story
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: author_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: community_id
                  type: BIGINT
              - column:
                  name: caption
                  type: VARCHAR(180)
              - column:
                  name: media_url
                  type: VARCHAR(1200)
                  constraints: { nullable: false }
              - column:
                  name: media_storage_key
                  type: VARCHAR(800)
                  constraints: { nullable: false }
              - column:
                  name: is_video
                  type: BOOLEAN
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: social_story
            baseColumnNames: author_id
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_social_story_author
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: social_story
            baseColumnNames: community_id
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_social_story_community
            onDelete: CASCADE
        - createIndex:
            tableName: social_story
            indexName: idx_social_story_expires
            columns:
              - column: { name: expires_at }
              - column: { name: id }
        - createIndex:
            tableName: social_story
            indexName: idx_social_story_author_recent
            columns:
              - column: { name: author_id }
              - column: { name: created_at }
        - createIndex:
            tableName: social_story
            indexName: idx_social_story_community_recent
            columns:
              - column: { name: community_id }
              - column: { name: created_at }
