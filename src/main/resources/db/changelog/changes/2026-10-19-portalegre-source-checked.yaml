databaseChangeLog:
  # Executa apenas após merge/deploy autorizado, preflight read-only e backup.
  # O SQL é apenas INSERT condicional; nomes alternativos exigem revisão prévia.
  - changeSet:
      id: 2026-10-19-portalegre-source-checked-v1
      author: jynlo-venues
      dbms: postgresql
      runInTransaction: true
      preConditions:
        onFail: HALT
        tableExists:
          schemaName: desporto24
          tableName: venue
      changes:
        - sqlFile:
            path: 2026-10-19-portalegre-source-checked.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
            endDelimiter: ;
