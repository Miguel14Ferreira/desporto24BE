databaseChangeLog:
  - changeSet:
      id: 2026-10-15-session-invite-table
      author: desporto24
      changes:
        - createTable:
            schemaName: desporto24
            tableName: session_invite
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: inviter_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: invitee_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: responded_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: session_invite
            baseColumnNames: session_id
            referencedTableSchemaName: desporto24
            referencedTableName: session
            referencedColumnNames: id
            constraintName: fk_session_invite_session
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: session_invite
            baseColumnNames: inviter_profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_session_invite_inviter
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: session_invite
            baseColumnNames: invitee_profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_session_invite_invitee
        - sql:
            dbms: postgresql
            sql: >-
              CREATE UNIQUE INDEX uq_session_invite_pending
              ON desporto24.session_invite (session_id, invitee_profile_id)
              WHERE status = 'PENDING';
        - createIndex:
            schemaName: desporto24
            tableName: session_invite
            indexName: idx_session_invite_invitee_status
            columns:
              - column:
                  name: invitee_profile_id
              - column:
                  name: status
              - column:
                  name: created_at
                  descending: true
