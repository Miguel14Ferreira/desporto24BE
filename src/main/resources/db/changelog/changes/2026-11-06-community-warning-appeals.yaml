databaseChangeLog:
  - changeSet:
      id: 2026-11-06-community-warning-appeals
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_warning_appeal
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: warning_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_community_warning_appeal_warning
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: author_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: statement
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_warning_appeal
            baseColumnNames: warning_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_disciplinary_warning
            referencedColumnNames: id
            constraintName: fk_community_warning_appeal_warning
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_warning_appeal
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_community_warning_appeal_community
            onDelete: CASCADE
        - createIndex:
            schemaName: desporto24
            tableName: community_warning_appeal
            indexName: idx_community_warning_appeal_recent
            columns:
              - column:
                  name: community_id
              - column:
                  name: created_at
