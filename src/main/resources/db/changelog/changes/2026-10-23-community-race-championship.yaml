databaseChangeLog:
  - changeSet:
      id: 2026-10-23-community-race-championship
      author: desporto24
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_race_rule
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_community_race_rule
                    nullable: false
              - column:
                  name: season_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sport
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: points_by_place
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_race_rule
            columnNames: season_id, sport
            constraintName: uq_community_race_rule_season_sport
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_race_rule
            baseColumnNames: season_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_season
            referencedColumnNames: id
            constraintName: fk_community_race_rule_season
            onDelete: CASCADE
        - addColumn:
            schemaName: desporto24
            tableName: community_round_entry
            columns:
              - column:
                  name: race_penalty_points
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: race_penalty_reason
                  type: VARCHAR(255)
