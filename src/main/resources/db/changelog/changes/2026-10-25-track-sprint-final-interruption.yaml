databaseChangeLog:
  - changeSet:
      id: 2026-10-25-track-sprint-final-interruption
      author: desporto24
      changes:
        - addColumn:
            tableName: community_track_sprint_bracket
            columns:
              - column: { name: interruption_stage, type: VARCHAR(36) }
              - column: { name: interruption_reference, type: VARCHAR(255) }
              - column: { name: interruption_reason, type: VARCHAR(500) }
              - column: { name: interruption_recorded_by, type: VARCHAR(100) }
              - column: { name: interruption_recorded_at, type: TIMESTAMP WITH TIME ZONE }
        - addCheckConstraint:
            tableName: community_track_sprint_bracket
            constraintName: chk_sprint_interruption_stage
            constraintBody: "interruption_stage IS NULL OR interruption_stage IN ('BEFORE_QUARTERS','AFTER_QUARTERS','AFTER_SEMIS')"
