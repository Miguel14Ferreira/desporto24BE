databaseChangeLog:
  - changeSet:
      id: 2026-10-28-user-session-presets-v1
      author: desporto24
      changes:
        - createTable:
            schemaName: desporto24
            tableName: session_preset
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(70)
                  constraints:
                    nullable: false
              - column:
                  name: settings_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: session_preset
            baseColumnNames: owner_profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_session_preset_owner
            onDelete: CASCADE
        - createIndex:
            schemaName: desporto24
            tableName: session_preset
            indexName: ix_session_preset_owner
            columns:
              - column:
                  name: owner_profile_id
