databaseChangeLog:
  - changeSet:
      id: 2026-10-22-venue-experience-rating
      author: desporto24
      changes:
        - createTable:
            tableName: venue_experience_rating
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_venue_experience_rating
                    nullable: false
              - column:
                  name: venue_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: score
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: venue_experience_rating
            baseColumnNames: venue_id
            referencedTableName: venue
            referencedColumnNames: id
            constraintName: fk_venue_experience_rating_venue
        - addForeignKeyConstraint:
            baseTableName: venue_experience_rating
            baseColumnNames: profile_id
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_venue_experience_rating_profile
        - addForeignKeyConstraint:
            baseTableName: venue_experience_rating
            baseColumnNames: session_id
            referencedTableName: session
            referencedColumnNames: id
            constraintName: fk_venue_experience_rating_session
        - addUniqueConstraint:
            tableName: venue_experience_rating
            columnNames: venue_id, profile_id
            constraintName: uk_venue_experience_rating_venue_profile
        - createIndex:
            tableName: venue_experience_rating
            indexName: idx_venue_experience_rating_venue
            columns:
              - column:
                  name: venue_id
        - sql:
            dbms: postgresql
            sql: |-
              ALTER TABLE desporto24.venue_experience_rating
              ADD CONSTRAINT ck_venue_experience_rating_score
              CHECK (score BETWEEN 1 AND 5)
