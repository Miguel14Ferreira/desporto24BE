databaseChangeLog:
  - changeSet:
      id: 2026-10-26-track-sprint-commissaire-reviews
      author: desporto24
      changes:
        - createTable:
            tableName: community_track_sprint_review
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: incident_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: action
                  type: VARCHAR(16)
                  constraints: { nullable: false }
              - column:
                  name: official_name
                  type: VARCHAR(120)
                  constraints: { nullable: false }
              - column:
                  name: official_reference
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: panel_reference
                  type: VARCHAR(255)
              - column:
                  name: reason
                  type: VARCHAR(500)
                  constraints: { nullable: false }
              - column:
                  name: recorded_by
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: recorded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: community_track_sprint_review
            baseColumnNames: incident_id
            referencedTableName: community_track_sprint_incident
            referencedColumnNames: id
            constraintName: fk_track_sprint_review_incident
        - createIndex:
            tableName: community_track_sprint_review
            indexName: idx_track_sprint_review_incident
            columns:
              - column: { name: incident_id }
