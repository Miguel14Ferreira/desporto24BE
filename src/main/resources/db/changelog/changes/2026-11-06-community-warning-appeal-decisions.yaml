databaseChangeLog:
  - changeSet:
      id: 2026-11-06-community-warning-appeal-decisions
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_warning_appeal_decision
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: appeal_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_community_warning_appeal_decision_appeal
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reviewed_by_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: outcome
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: decided_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_warning_appeal_decision
            baseColumnNames: appeal_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_warning_appeal
            referencedColumnNames: id
            constraintName: fk_community_appeal_decision_appeal
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_warning_appeal_decision
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_community_appeal_decision_community
            onDelete: CASCADE
        - createIndex:
            schemaName: desporto24
            tableName: community_warning_appeal_decision
            indexName: idx_community_appeal_decisions_recent
            columns:
              - column:
                  name: community_id
              - column:
                  name: decided_at
