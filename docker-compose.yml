services:
  desporto24app:
    container_name: desporto24container
    build:
      context: .
      args:
        CONTAINER_PORT: ${CONTAINER_PORT}
    image: desporto24:v1
    restart: unless-stopped
    env_file:
      - ${ENV_FILE}
    expose:
      - ${CONTAINER_PORT}
    ports:
      - ${CONTAINER_PORT}:${HOST_PORT}