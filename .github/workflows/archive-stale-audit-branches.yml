name: Archive and delete exact obsolete audit branches
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'DRY_RUN or ARCHIVE_AND_DELETE_EXACT_AUDITS'
        required: true
        default: DRY_RUN
        type: choice
        options:
          - DRY_RUN
          - ARCHIVE_AND_DELETE_EXACT_AUDITS
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: archive-exact-stale-audit-branches
  cancel-in-progress: false
jobs:
  archive-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision equals dispatch SHA
        env:
          EXPECTED_RUN_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "PINNED_RUN_SHA=$actual_sha"
          test "$actual_sha" = "$EXPECTED_RUN_SHA"
      - name: Validate safety tests before any mutation
        run: |
          python3 -m py_compile scripts/archive_stale_audit_branches.py scripts/test_archive_stale_audit_branches.py
          python3 -m unittest discover -s scripts -p 'test_archive_stale_audit_branches.py' -v
      - name: Dry run or archive and delete pinned audit branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRM_DELETE: ${{ inputs.confirmation }}
        run: python3 scripts/archive_stale_audit_branches.py
