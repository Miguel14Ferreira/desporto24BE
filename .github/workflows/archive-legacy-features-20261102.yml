name: Jynlo archive legacy feature branches with exact recovery tags
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/archive-legacy-features-20261102.yml']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: jynlo-archive-legacy-features-20261102
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Preserve code history with pinned recovery refs and prune unused heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request,urllib.error,urllib.parse
          repo=os.environ['REPO']
          prefixes=('feat/','feature/','fix/','security/','style/','refactor/','release/','revert/','backup/','data/','sync/','cleanup/','preview/')
          protected={'develop','master','main','feature/desporto24-preview-deploy'}
          def api(method,path,data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,
                method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
                data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(request,timeout=40) as r:
                  payload=r.read()
                  return json.loads(payload) if payload else {}
          branches=[]
          for page in range(1,7):
              batch=api('GET','/branches?per_page=100&page='+str(page))
              branches+=batch
              if len(batch)<100:break
          base=api('GET','/git/ref/heads/develop')['object']['sha']
          candidates=[(b['name'],b['commit']['sha']) for b in branches
               if b['name'].startswith(prefixes) and b['name'] not in protected and
               not b.get('protected',False) and re.fullmatch(r'[A-Za-z0-9._/-]+',b['name'])
               and re.fullmatch(r'[0-9a-f]{40}',b['commit']['sha'])]
          print('DISCOVERED',len(branches),'CANDIDATES',len(candidates),'BASE',base,flush=True)
          archived=0;skipped=0
          for name,sha in candidates:
              encoded=urllib.parse.quote(name,safe='/')
              try:
                  current=api('GET','/git/ref/heads/'+encoded)['object']['sha']
                  if current!=sha:
                      print('SKIP_MOVED',name,flush=True);skipped+=1;continue
                  prs=api('GET','/pulls?state=open&head='+urllib.parse.quote(repo.split('/')[0]+':'+name,safe='')+'&per_page=100')
                  if prs:
                      print('SKIP_OPEN_PR',name,flush=True);skipped+=1;continue
                  comparison=api('GET','/compare/'+base+'...'+sha)
                  ahead=comparison.get('ahead_by')
                  behind=comparison.get('behind_by')
                  tag='archive/jynlo-legacy-preserved-20261102/'+name
                  enc_tag=urllib.parse.quote(tag,safe='/')
                  try:
                      old=api('GET','/git/ref/tags/'+enc_tag)
                      assert old['object']['sha']==sha,'Archive collision for '+name
                  except urllib.error.HTTPError as e:
                      if e.code!=404: raise
                      api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
                  assert api('GET','/git/ref/tags/'+enc_tag)['object']['sha']==sha,'Archive unverified '+name
                  assert api('GET','/git/ref/heads/'+encoded)['object']['sha']==sha,'Branch moved '+name
                  try:
                      api('DELETE','/git/refs/heads/'+encoded)
                  except urllib.error.HTTPError as e:
                      if e.code in (404,409,422):
                          print('SKIP_DELETE_REJECTED',name,e.code,flush=True);skipped+=1;continue
                      raise
                  archived+=1
                  print('ARCHIVED_AND_DELETED',name,'SHA',sha,'AHEAD',ahead,'BEHIND',behind,'TAG',tag,flush=True)
              except urllib.error.HTTPError as e:
                  if e.code in (404,409,422):
                      print('SKIP_REQUEST_REJECTED',name,e.code,flush=True);skipped+=1;continue
                  raise
          print('ARCHIVED_TOTAL',archived,'SKIPPED',skipped,flush=True)
          PY
