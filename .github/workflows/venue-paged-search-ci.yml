name: Validate paginated venue suggestions
on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/main/java/com/example/desporto24/controllers/VenueController.java'
      - 'src/main/java/com/example/desporto24/service/VenueService.java'
      - 'src/main/java/com/example/desporto24/repository/venue/VenueRepository.java'
      - 'src/main/java/com/example/desporto24/model/dto/venue/VenueSearchPageResponse.java'
      - 'src/main/resources/db/changelog/**'
      - 'src/test/java/com/example/desporto24/controllers/VenuePagedSearchControllerTest.java'
      - 'src/test/java/com/example/desporto24/service/VenuePagedSearchServiceTest.java'
      - 'src/test/java/com/example/desporto24/repository/venue/VenuePagedSearchRepositoryTest.java'
      - '.github/workflows/venue-paged-search-ci.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Execute backend tests
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp test
