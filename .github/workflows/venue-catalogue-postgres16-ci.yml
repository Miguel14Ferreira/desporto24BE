name: Venue catalogue Liquibase PostgreSQL 16 integration

# Never connects to Render or production. GitHub-hosted throwaway PostgreSQL only.
# Draft PRs do not run the job; ready_for_review triggers a single verification.
on:
  pull_request:
    types: [ready_for_review]
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/main/resources/db/changelog/changes/2026-10-19-*.sql'
      - 'src/main/resources/db/changelog/changes/2026-10-19-*.yaml'
      - 'src/main/resources/db/changelog/changes/2026-10-20-national-municipal-batch-13.*'
      - 'src/main/resources/db/changelog/venue-imports/preflight-sao-jacinto-READONLY.sql'
      - 'scripts/test_sao_jacinto_preflight.py'
      - '.github/workflows/venue-catalogue-postgres16-ci.yml'

permissions:
  contents: read

jobs:
  postgres16-liquibase:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: venues_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venues_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: venues_test
      PGUSER: postgres
      PGPASSWORD: local_test_only
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client and disposable venue fixture
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255) NOT NULL,
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            website VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE (information_source, source_reference)
          );
          INSERT INTO desporto24.venue
            (name,city,district,address,information_source,latitude,longitude,created_at)
          VALUES
            ('Campo Municipal do Viso','Porto',NULL,'Morada de utilizador','COMMUNITY',NULL,NULL,NOW()),
            ('Recinto legado Braga','Braga',NULL,'Morada legada A','COMMUNITY',NULL,NULL,NOW()),
            ('Recinto legado intacto','Braga','Porto','Morada legada B','COMMUNITY',NULL,NULL,NOW()),
            ('Recinto teste em Lisboa','Cacém',NULL,'Morada legada C','COMMUNITY',38.80,-9.20,NOW()),
            ('Recinto teste fora Lisboa','Cacém',NULL,'Morada legada D','COMMUNITY',40.10,-8.20,NOW());
          SQL
      - name: Verify São Jacinto preflight against empty and alias fixtures (read-only SQL)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_sao_jacinto_preflight.py' -v
          QUERY=src/main/resources/db/changelog/venue-imports/preflight-sao-jacinto-READONLY.sql
          baseline="$(psql -At -v ON_ERROR_STOP=1 -f "$QUERY")"
          echo "$baseline" | grep -F '|NO_MATCH_FOUND|'
          # The alias is inserted into an explicit test-only transaction and rolled back.
          alias_output="$(psql -At -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO desporto24.venue
            (name, city, district, address, information_source, created_at)
          VALUES ('Piscinas Municipais de São Jacinto', 'São Jacinto', 'Aveiro',
                  'Morada alternativa não confirmada', 'COMMUNITY', NOW());
          \\i src/main/resources/db/changelog/venue-imports/preflight-sao-jacinto-READONLY.sql
          ROLLBACK;
          SQL
          )"
          echo "$alias_output" | grep -F '|POTENTIAL_POOL_ALIAS_REVIEW|'
          test "$(psql -At -c "SELECT COUNT(*) FROM desporto24.venue WHERE name = 'Piscinas Municipais de São Jacinto'")" = 0
          echo 'PASS: São Jacinto corrected candidate query is read-only, bounded and detects likely legacy aliases.'
      - name: Build test-only master using exactly the five production venue changesets
        shell: bash
        run: |
          set -euo pipefail
          cat > src/main/resources/db/changelog/ci-venue-catalogue.yaml <<'YAML'
          databaseChangeLog:
            - include:
                file: changes/2026-10-19-backfill-known-districts.yaml
                relativeToChangelogFile: true
            - include:
                file: changes/2026-10-19-portalegre-source-checked.yaml
                relativeToChangelogFile: true
            - include:
                file: changes/2026-10-19-first-official-district-venues.yaml
                relativeToChangelogFile: true
            - include:
                file: changes/2026-10-19-pestana-7-source-corroborated.yaml
                relativeToChangelogFile: true
            - include:
                file: changes/2026-10-20-national-municipal-batch-13.yaml
                relativeToChangelogFile: true
          YAML
      - name: Apply real Liquibase YAML twice on disposable PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          run_liquibase() {
            docker run --rm --network host \
              -v "$PWD/src/main/resources/db/changelog:/liquibase/changelog:ro" \
              liquibase:4.33.0 \
              --url=jdbc:postgresql://127.0.0.1:5432/venues_test?currentSchema=desporto24 \
              --username=postgres --password=local_test_only \
              --default-schema-name=desporto24 \
              --liquibase-schema-name=desporto24 \
              --search-path=/liquibase/changelog \
              --changelog-file=ci-venue-catalogue.yaml \
              update
          }
          run_liquibase
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.databasechangelog) <> 5 THEN
              RAISE EXCEPTION 'Five real Liquibase changeSets must be recorded';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 41 THEN
              RAISE EXCEPTION 'Expected 5 fixtures + 36 new records; one existing named venue must be skipped';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue WHERE source_reference IS NOT NULL) <> 36 THEN
              RAISE EXCEPTION '37 proposed venues minus one pre-existing community duplicate = 36';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE name='Campo Municipal do Viso' AND city='Porto') <> 1 THEN
              RAISE EXCEPTION 'Existing community venue must not be duplicated';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM desporto24.venue
                WHERE name='Campo Municipal do Viso' AND address='Morada de utilizador'
                  AND information_source='COMMUNITY' AND source_reference IS NULL) THEN
              RAISE EXCEPTION 'Original community venue must remain untouched';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM desporto24.venue
                WHERE name='Recinto legado Braga' AND district='Braga') THEN
              RAISE EXCEPTION 'District backfill should fill a missing known district';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM desporto24.venue
                WHERE name='Recinto legado intacto' AND district='Porto') THEN
              RAISE EXCEPTION 'District backfill must not overwrite existing values';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM desporto24.venue
                WHERE name='Recinto teste em Lisboa' AND district='Lisboa') THEN
              RAISE EXCEPTION 'Coordinate-scoped Cacém backfill should apply';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM desporto24.venue
                WHERE name='Recinto teste fora Lisboa' AND district IS NULL) THEN
              RAISE EXCEPTION 'Cacém outside location bounds must remain unassigned';
            END IF;
          END $$;
          SQL
          before="$(psql -At -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM desporto24.venue')"
          run_liquibase
          after="$(psql -At -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM desporto24.venue')"
          test "$before" = "$after"
          test "$(psql -At -c 'SELECT COUNT(*) FROM desporto24.databasechangelog')" = 5
          echo "PASS: 5 Liquibase changesets; 36 new venues; original data preserved; second update idempotent."
          echo "Production DB was not accessed."
