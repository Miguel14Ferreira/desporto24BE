name: Backend reconcile develop - isolated candidate
on:
  push:
    branches:
      - chore/reconcile-develop-production-20261030
permissions:
  contents: write
jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[reconciled]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge develop retaining existing production behavior in conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin develop
          git merge --no-commit --no-ff origin/develop || true
          git diff --name-only --diff-filter=U > conflict-files.txt
          echo "Conflicts requiring explicit later review:"
          cat conflict-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            git checkout --ours -- "$file"
            git add -- "$file"
          done < conflict-files.txt
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"; exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(reconcile): merge develop and retain production versions for 9 conflicts [reconciled]"
          git push origin HEAD:chore/reconcile-develop-production-20261030
      - uses: actions/upload-artifact@v4
        with:
          name: conflict-files-preserved-prod
          path: conflict-files.txt
