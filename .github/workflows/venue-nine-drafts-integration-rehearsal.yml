name: Nine venue draft integration rehearsal (isolated PostgreSQL16)

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - '.github/workflows/venue-nine-drafts-integration-rehearsal.yml'
      - 'docs/venue-imports/2026-10-26-nine-drafts-integration-rehearsal.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nine-venues:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: isolated_nine_venues
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nine_venues_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isolated_nine_venues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: isolated_nine_venues
      PGUSER: postgres
      PGPASSWORD: nine_venues_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
      - name: Pin the 3 unmerged source files at their reviewed Git object IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jynlo-nine-drafts"
          fetch_sql () {
            local source_branch="$1" relative_path="$2" expected_blob="$3" dest="$4"
            git fetch --no-tags origin \
              "+refs/heads/$source_branch:refs/remotes/origin/$source_branch"
            git show "refs/remotes/origin/$source_branch:$relative_path" \
              > "$RUNNER_TEMP/jynlo-nine-drafts/$dest"
            local actual_blob
            actual_blob="$(git hash-object "$RUNNER_TEMP/jynlo-nine-drafts/$dest")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              echo "ERROR: $dest draft changed; review the new SQL and update this workflow" >&2
              exit 1
            fi
          }
          fetch_sql release/venue-mem-ramires-draft-20261026 \
            src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-santarem-mem-ramires-DRAFT.sql \
            4d153500f51b877244a14ef0ac185d52bc308397 01-santarem.sql
          fetch_sql release/venue-castelo-branco-alcains-draft-20261026 \
            src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-castelo-branco-alcains-DRAFT.sql \
            ef02d68ec304651a1caab4f939fbf8d7f8657593 02-castelo-alcains.sql
          fetch_sql release/island-six-official-venues-draft-20261026 \
            src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-island-six-official-DRAFT.sql \
            f3a93af4ff874db4e40c072eb54ce70013001185 03-islands.sql
          for f in "$RUNNER_TEMP"/jynlo-nine-drafts/*.sql; do
            test -s "$f"
            ! grep -Eqi '(^|[[:space:]])(UPDATE|DELETE|TRUNCATE|DROP|ALTER|GRANT|COPY)([[:space:]]|$)' "$f"
          done
          test "$(grep -hc '^INSERT INTO desporto24.venue' "$RUNNER_TEMP"/jynlo-nine-drafts/*.sql | awk '{s+=$1} END {print s}')" = "9"
          echo "PASS: 1+2+6 DRAFT sources fetched at pinned Git hashes; no master include"
      - name: Create disposable schema mirroring actual source/location constraints
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255),
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            website VARCHAR(255),
            contact VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference
              UNIQUE (information_source, source_reference),
            CONSTRAINT ck_venue_address_or_mainland_gps CHECK (
              NULLIF(BTRIM(address), '') IS NOT NULL
              OR (latitude IS NOT NULL AND longitude IS NOT NULL
                AND latitude BETWEEN 36.8 AND 42.3
                AND longitude BETWEEN -9.6 AND -6.0)
            )
          );
          SQL
      - name: Apply nine draft inserts together twice and verify zero duplicates
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2; do
            for f in "$RUNNER_TEMP"/jynlo-nine-drafts/*.sql; do
              psql -X -q -v ON_ERROR_STOP=1 -f "$f"
            done
          done
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Nine combined draft inserts must stay at nine on repeat';
            END IF;
            IF (SELECT COUNT(DISTINCT source_reference) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Nine distinct source references required';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
              WHERE district='Açores') <> 2
              OR (SELECT COUNT(*) FROM desporto24.venue
                WHERE district='Madeira') <> 4 THEN
              RAISE EXCEPTION 'Regions must be 2 Azores and 4 Madeira';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE information_source = 'OFFICIAL'
                  AND contact IS NULL AND latitude IS NULL AND longitude IS NULL
                  AND NULLIF(BTRIM(address), '') IS NOT NULL) <> 9 THEN
              RAISE EXCEPTION 'All nine require official source, true address and null phone/GPS';
            END IF;
          END $$;
          SQL
      - name: Protect community aliases from being duplicated or overwritten
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name, city, district, address, information_source, contact, created_at)
          VALUES
            ('Pavilhão Mem Ramires - comunitário','Santarém','Santarém',
             'Rua Doutor Virgílio Arruda, 2000-217 Santarém',
             'COMMUNITY','KEEP-PRIVATE-1',NOW()),
            ('Pavilhão Municipal de Castelo Branco','Castelo Branco','Castelo Branco',
             'Morada alternativa comunitária','COMMUNITY','KEEP-PRIVATE-2',NOW()),
            ('Piscina da Vila de Alcains','Alcains','Castelo Branco',
             'Estrada de Santa, 6005-000 Alcains',
             'COMMUNITY','KEEP-PRIVATE-3',NOW()),
            ('Piscinas do Funchal','Funchal','Madeira',
             'Beco dos Álamos, Santo António, Funchal',
             'COMMUNITY','KEEP-PRIVATE-4',NOW());
          SQL
          for f in "$RUNNER_TEMP"/jynlo-nine-drafts/*.sql; do
            psql -X -q -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION '4 pre-existing aliases + 5 fresh must total nine';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE information_source='COMMUNITY'
                AND contact LIKE 'KEEP-PRIVATE-%') <> 4 THEN
              RAISE EXCEPTION 'Existing community aliases must not change';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE information_source='OFFICIAL') <> 5 THEN
              RAISE EXCEPTION 'Must skip four facilities already present under aliases';
            END IF;
          END $$;
          SQL
          echo 'PASS: all nine drafts coexist, are idempotent and preserve 4 community aliases'
      - name: Assert no production network/database or master changelog modifications
        run: |
          set -euo pipefail
          ! grep -F 'nine-drafts-integration-rehearsal' src/main/resources/db/changelog/db.changelog-master.yaml
          echo "PASS: disposable PostgreSQL16 only; no production SQL was executed"
