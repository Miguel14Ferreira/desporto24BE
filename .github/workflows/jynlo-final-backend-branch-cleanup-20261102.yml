name: Jynlo final backend obsolete branch cleanup
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/jynlo-final-backend-branch-cleanup-20261102.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate archived source and permanently remove old branch ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          repo=os.environ['REPO']
          assert repo=='Miguel14Ferreira/desporto24BE',repo
          old='feature/desporto24-preview-deploy'
          old_sha='f0f7fe46ee3fba20338c9017b6a456bcffb97d81'
          tag='archive/render-backend-source-before-develop-20261102'
          def req(method,path,body=None):
              url='https://api.github.com/repos/'+repo+path
              r=urllib.request.Request(url,method=method,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28',
                           'Content-Type':'application/json'},
                  data=None if body is None else json.dumps(body).encode())
              with urllib.request.urlopen(r,timeout=35) as resp:
                  data=resp.read()
                  return json.loads(data) if data else {}
          assert req('GET','/git/ref/tags/'+tag)['object']['sha']==old_sha,'Archive missing or mismatch'
          assert req('GET','/git/ref/heads/'+old)['object']['sha']==old_sha,'Old branch was moved'
          dev=req('GET','/git/ref/heads/develop')['object']['sha']
          comp=req('GET','/compare/'+dev+'...'+old_sha)
          assert comp.get('ahead_by')==0,'Old branch has unmerged commits'
          open_prs=req('GET','/pulls?state=open&head=Miguel14Ferreira%3Afeature%2Fdesporto24-preview-deploy&per_page=100')
          assert not open_prs,'Open PR exists'
          req('DELETE','/git/refs/heads/'+old)
          try:
              req('GET','/git/ref/heads/'+old)
          except urllib.error.HTTPError as e:
              assert e.code==404,e.code
          else:
              raise RuntimeError('Old branch still exists')
          assert req('GET','/git/ref/tags/'+tag)['object']['sha']==old_sha
          branches=req('GET','/branches?per_page=100&page=1')
          names=[b['name'] for b in branches]
          assert sorted(names)==['develop','master'],names
          print('JYNLO_BACKEND_CLEANUP_COMPLETE',','.join(names),'ARCHIVE_SHA',old_sha,flush=True)
          PY
