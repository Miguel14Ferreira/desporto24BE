name: Jynlo community discipline CI
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/jynlo-community-discipline-ci.yml'
      - 'src/main/java/com/example/desporto24/controllers/CommunityDisciplineController.java'
      - 'src/main/java/com/example/desporto24/service/CommunityDisciplineService.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityDisciplinaryWarning.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityDisciplinaryWarningRepository.java'
      - 'src/main/resources/db/changelog/changes/2026-11-06-community-discipline-warnings.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/test/java/com/example/desporto24/service/CommunityDisciplineServiceTest.java'
      - 'src/main/java/com/example/desporto24/service/CommunityWarningAppealService.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityWarningAppeal.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityWarningAppealRepository.java'
      - 'src/main/resources/db/changelog/changes/2026-11-06-community-warning-appeals.yaml'
      - 'src/test/java/com/example/desporto24/service/CommunityWarningAppealServiceTest.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityWarningAppealDecision.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityWarningAppealDecisionRepository.java'
      - 'src/main/java/com/example/desporto24/service/CommunityWarningAppealReviewService.java'
      - 'src/main/resources/db/changelog/changes/2026-11-06-community-warning-appeal-decisions.yaml'
      - 'src/test/java/com/example/desporto24/service/CommunityWarningAppealReviewServiceTest.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentSuspensionService.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentSuspension.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentSuspensionRepository.java'
      - 'src/main/resources/db/changelog/changes/2026-11-06-community-tournament-suspensions.yaml'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentTeamService.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentSuspensionServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentTeamServiceTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend and test community warning permissions
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp -Dtest=CommunityDisciplineServiceTest,CommunityWarningAppealServiceTest,CommunityWarningAppealReviewServiceTest,CommunityTournamentSuspensionServiceTest,CommunityTournamentServiceTest,CommunityTournamentTeamServiceTest test
