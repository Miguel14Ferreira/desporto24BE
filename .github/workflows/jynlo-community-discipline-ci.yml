name: Jynlo community discipline CI
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/jynlo-community-discipline-ci.yml'
      - 'src/main/java/com/example/desporto24/controllers/CommunityDisciplineController.java'
      - 'src/main/java/com/example/desporto24/service/CommunityDisciplineService.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityDisciplinaryWarning.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityDisciplinaryWarningRepository.java'
      - 'src/main/resources/db/changelog/changes/2026-11-06-community-discipline-warnings.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/test/java/com/example/desporto24/service/CommunityDisciplineServiceTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend and test community warning permissions
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp -Dtest=CommunityDisciplineServiceTest test
