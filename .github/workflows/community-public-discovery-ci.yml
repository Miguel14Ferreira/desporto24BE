name: Validate community public discovery
on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/main/java/com/example/desporto24/controllers/CommunityDiscoveryController.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityRepository.java'
      - 'src/test/java/com/example/desporto24/controllers/CommunityDiscoveryControllerTest.java'
      - 'src/test/java/com/example/desporto24/repository/community/CommunityPublicDiscoveryTest.java'
      - '.github/workflows/community-public-discovery-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run full backend tests
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp test
