name: Five island official venues Liquibase PostgreSQL16 release

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - 'src/main/resources/db/changelog/changes/2026-10-26-five-island-official-venues.*'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - '.github/workflows/venue-five-islands-release-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-islands:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: five_islands_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_pg16_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d five_islands_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: five_islands_ci
      PGUSER: postgres
      PGPASSWORD: synthetic_pg16_only
    steps:
      - uses: actions/checkout@v4
      - name: Validate precisely one registered changeset and five inserts
        run: |
          set -euo pipefail
          yaml=src/main/resources/db/changelog/changes/2026-10-26-five-island-official-venues.yaml
          sql=src/main/resources/db/changelog/changes/2026-10-26-five-island-official-venues.sql
          master=src/main/resources/db/changelog/db.changelog-master.yaml
          test "$(grep -Fc 'file: db/changelog/changes/2026-10-26-five-island-official-venues.yaml' "$master")" = 1
          test "$(grep -c '^INSERT INTO desporto24.venue' "$sql")" = 5
          test "$(grep -c '^ON CONFLICT DO NOTHING;' "$sql")" = 5
          test "$(grep -Fc 'runInTransaction: true' "$yaml")" = 1
          ! grep -Eqi '(^|[[:space:]])(UPDATE|DELETE|TRUNCATE|DROP|ALTER|GRANT)[[:space:]]+desporto24' "$sql"
          echo 'PASS: five insert-only idempotent statements; master changed only for single release'
      - name: Create synthetic venue schema in PG16 (never LIVE)
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255),
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            website VARCHAR(255),
            contact VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE (information_source, source_reference),
            CONSTRAINT ck_venue_address_or_mainland_gps CHECK (
              NULLIF(BTRIM(address), '') IS NOT NULL
              OR (latitude IS NOT NULL AND longitude IS NOT NULL
                  AND latitude BETWEEN 36.8 AND 42.3
                  AND longitude BETWEEN -9.6 AND -6.0)
            )
          );
          SQL
      - name: Apply actual Liquibase changeset twice (PG16, transactional)
        run: |
          set -euo pipefail
          cat > src/main/resources/db/changelog/ci-five-island-venues.yaml <<'YAML'
          databaseChangeLog:
            - include:
                file: changes/2026-10-26-five-island-official-venues.yaml
                relativeToChangelogFile: true
          YAML
          migrate() {
            docker run --rm --network host \
              -v "$PWD/src/main/resources/db/changelog:/liquibase/changelog:ro" \
              liquibase:4.33.0 \
              --url=jdbc:postgresql://127.0.0.1:5432/five_islands_ci?currentSchema=desporto24 \
              --username=postgres --password=synthetic_pg16_only \
              --default-schema-name=desporto24 \
              --liquibase-schema-name=desporto24 \
              --search-path=/liquibase/changelog \
              --changelog-file=ci-five-island-venues.yaml update
          }
          migrate
          migrate
      - name: Assert 4 Açores, 1 Madeira, 5 unique refs, 0 invented GPS/contact
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 5
              OR (SELECT COUNT(DISTINCT source_reference) FROM desporto24.venue) <> 5 THEN
              RAISE EXCEPTION '5 unique venues required even after second Liquibase run';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue WHERE district='Açores') <> 4
              OR (SELECT COUNT(*) FROM desporto24.venue WHERE district='Madeira') <> 1 THEN
              RAISE EXCEPTION 'Expected precisely 4 Açores + 1 Madeira';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
              WHERE contact IS NULL AND latitude IS NULL AND longitude IS NULL
                AND NULLIF(BTRIM(address), '') IS NOT NULL AND information_source='OFFICIAL') <> 5 THEN
              RAISE EXCEPTION 'No invented contacts or coordinates';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.databasechangelog
              WHERE id='2026-10-26-five-island-official-venues-v1') <> 1 THEN
              RAISE EXCEPTION 'Liquibase should run exactly once';
            END IF;
          END $$;
          SQL
          echo 'PASS: five source-backed venue rows, two region totals, no duplicated migration'
      - name: Preserve three existing community aliases and insert only two new facilities
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name,city,district,address,information_source,contact,created_at)
          VALUES
            ('Complexo Desportivo João Paulo II','Angra do Heroísmo','Açores',
             'Outra morada comunitária','COMMUNITY','KEEP-1',NOW()),
            ('Pavilhão Municipal de Angra','Angra do Heroísmo','Açores',
             'Cerrado do Bailão, 9700-017 Angra do Heroísmo',
             'COMMUNITY','KEEP-2',NOW()),
            ('Pavilhão Multiusos do Porto Santo','Porto Santo','Madeira',
             'Outra morada comunitária','COMMUNITY','KEEP-3',NOW());
          SQL
          psql -X -v ON_ERROR_STOP=1 \
            -f src/main/resources/db/changelog/changes/2026-10-26-five-island-official-venues.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 5
              OR (SELECT COUNT(*) FROM desporto24.venue
                  WHERE information_source='COMMUNITY' AND contact LIKE 'KEEP-%') <> 3
              OR (SELECT COUNT(*) FROM desporto24.venue WHERE information_source='OFFICIAL') <> 2 THEN
              RAISE EXCEPTION 'Aliases must not be duplicated or changed';
            END IF;
          END $$;
          SQL
          echo 'PASS: three community aliases untouched; only two new rows'
      - name: Confirm no production database nor exports used
        run: |
          set -euo pipefail
          ! grep -Eq 'RENDER_API_KEY|POSTGRES_HOST|POSTGRES_PASSWORD' \
            src/main/resources/db/changelog/changes/2026-10-26-five-island-official-venues.sql
          echo 'PASS: synthetic PostgreSQL16, no LIVE credentials or backup'
