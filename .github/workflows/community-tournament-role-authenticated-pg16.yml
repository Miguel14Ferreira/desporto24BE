name: Community tournament roles signed JWT HTTP - isolated PostgreSQL 16

# Full Spring Security JWT + actual controllers/services/JPA, never Render.
# Trigger only when this integration test/workflow changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentRoleAuthenticatedPgIT.java'
      - '.github/workflows/community-tournament-role-authenticated-pg16.yml'

permissions:
  contents: read

concurrency:
  group: tournament-role-auth-pg16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-role-fixture:
    name: JWT + HTTP + real tournaments, disposable PG16
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: community_role_auth_qa
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d community_role_auth_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      JYNLO_TEST_PG_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/community_role_auth_qa
      JYNLO_TEST_PG_USERNAME: qa
      JYNLO_TEST_PG_PASSWORD: local_only
      UI_APP_URL: http://127.0.0.1:4200
      VERIFY_EMAIL_HOST: http://127.0.0.1:8080
      AES_ENCRYPTION_KEY: ciKey1
      JWT_SECRET: isolated_jynlo_community_roles_pg16_auth_contract_key_2026
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: community_role_auth_qa
      POSTGRES_USERNAME: qa
      POSTGRES_PASSWORD: local_only
      POSTGRES_SCHEMA: desporto24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create isolated PostgreSQL schema
        env:
          PGPASSWORD: local_only
        run: psql -h 127.0.0.1 -U qa -d community_role_auth_qa -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA desporto24 AUTHORIZATION qa'
      - name: Verify signed JWT role matrix with real HTTP and ephemeral database
        run: bash ./mvnw -B -ntp -Dtest=CommunityTournamentRoleAuthenticatedPgIT test
