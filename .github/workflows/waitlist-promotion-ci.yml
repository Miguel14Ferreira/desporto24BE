name: Validate waitlist promotions
on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/main/java/com/example/desporto24/service/WaitlistPromotionService.java'
      - 'src/test/java/com/example/desporto24/service/WaitlistPromotionServiceTest.java'
      - '.github/workflows/waitlist-promotion-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp test
