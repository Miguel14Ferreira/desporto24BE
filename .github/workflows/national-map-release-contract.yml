name: National map Liquibase release contract (opt-in)
on:
  pull_request:
    branches:
      - feature/desporto24-preview-deploy
    paths:
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/main/resources/db/changelog/venue-imports/drafts/national-20261022/**'
      - 'scripts/validate_national_map_release_contract.py'
      - '.github/workflows/national-map-release-contract.yml'

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PGPASSWORD: isolated_only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_only
          POSTGRES_DB: release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse YAML and verify immutable 18-district SQL checksums
        run: |
          python -m pip install --quiet 'PyYAML==6.0.2'
          python scripts/validate_national_map_release_contract.py
      - name: Create disposable PostgreSQL16 venue schema (not production)
        env:
          PGCID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PGCID" psql -X -v ON_ERROR_STOP=1 -U postgres -d release_test <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGSERIAL PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255),
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL,
            source_reference VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMP NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE (information_source, source_reference),
            CONSTRAINT ck_venue_address_or_mainland_gps CHECK (
              NULLIF(BTRIM(address), '') IS NOT NULL
              OR (latitude BETWEEN 36.8 AND 42.3 AND longitude BETWEEN -9.6 AND -6)
            )
          );
          CREATE INDEX idx_venue_city_name ON desporto24.venue(LOWER(city),LOWER(name));
          SQL
      - name: Liquibase CLI runs all 27 changesets against disposable PostgreSQL16
        env:
          PGCID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          echo 'Release SQL runs ONLY against local runner PG16 on 127.0.0.1.'
          run_liquibase() {
            docker run --rm --network host \
              -v "$PWD/src/main/resources:/liquibase/changelog:ro" \
              liquibase/liquibase:4.30 \
              --url=jdbc:postgresql://127.0.0.1:5432/release_test \
              --username=postgres --password="$PGPASSWORD" \
              --default-schema-name=desporto24 \
              --search-path=/liquibase/changelog \
              --changelog-file=db/changelog/venue-imports/drafts/national-20261022/national-18-districts-OPT-IN.yaml \
              update
          }
          run_liquibase
          first="$(docker exec "$PGCID" psql -X -At -U postgres -d release_test -c 'SELECT COUNT(*) FROM desporto24.venue')"
          test "$first" -ge 3000
          test "$first" -le 3331
          districts="$(docker exec "$PGCID" psql -X -At -U postgres -d release_test -c 'SELECT COUNT(DISTINCT district) FROM desporto24.venue')"
          test "$districts" = 18
          changes="$(docker exec "$PGCID" psql -X -At -U postgres -d release_test -c 'SELECT COUNT(*) FROM desporto24.databasechangelog')"
          test "$changes" = 27
          run_liquibase
          second="$(docker exec "$PGCID" psql -X -At -U postgres -d release_test -c 'SELECT COUNT(*) FROM desporto24.venue')"
          test "$second" = "$first"
          echo "LIQUIBASE_27_PASS: candidates=$first, districts=18, changesets=27, replay_additional=0"
