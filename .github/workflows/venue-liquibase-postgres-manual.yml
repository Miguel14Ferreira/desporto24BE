name: Venue Liquibase PostgreSQL dry-run (manual)

# PostgreSQL container smoke test only by explicit choice.
# This workflow must be present in the default branch before Actions UI dispatch.
on:
  workflow_dispatch:

concurrency:
  group: venue-postgres-dryrun-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-liquibase-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: venues_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venues_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: venues_test
      PGUSER: postgres
      PGPASSWORD: local_test_only
      PGOPTIONS: '-c search_path=desporto24,public'
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client (test DB only)
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - name: Create an isolated test schema compatible with the Venue entity
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255) NOT NULL,
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMP WITH TIME ZONE NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE(information_source, source_reference)
          );
          SQL
      - name: Run draft SQL on disposable Postgres 16 and check idempotency
        shell: bash
        run: |
          set -euo pipefail
          SQL=src/main/resources/db/changelog/venue-imports/drafts/2026-10-19-portalegre-source-checked-DRAFT.sql
          psql -v ON_ERROR_STOP=1 -f "$SQL" >/dev/null
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Expected 9 venues after first run';
            END IF;
            IF (SELECT COUNT(DISTINCT source_reference) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Source refs must be distinct';
            END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f "$SQL" >/dev/null
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Running twice must not add venues';
            END IF;
          END $$;
          SQL
      - name: Verify matching records remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE TABLE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name, city, address, latitude, longitude, information_source, created_at)
          VALUES ('Estádio Patalino', 'Elvas', 'Morada comunitária',
                  38.8772886, -7.1577876, 'COMMUNITY', CURRENT_TIMESTAMP);
          SQL
          psql -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-19-portalegre-source-checked-DRAFT.sql >/dev/null
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Existing community venue should prevent duplicate';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM desporto24.venue WHERE name='Estádio Patalino'
                 AND address='Morada comunitária' AND information_source='COMMUNITY'
            ) THEN
              RAISE EXCEPTION 'Existing venue must not be modified';
            END IF;
          END $$;
          SQL
      - name: Run read-only preflight and confirm it detects source duplication
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-19-portalegre-preflight-READONLY.sql
          test "$(psql -At -c 'SELECT COUNT(*) FROM desporto24.venue')" = 9
          echo 'PostgreSQL integration smoke test succeeded. Production was never accessed.'
