name: First-50 venue evidence offline checks
on:
  push:
    branches: ['feature/jynlo-first-50-municipal-evidence-20261021']
    paths:
      - 'scripts/check_national_review_evidence.py'
      - 'scripts/test_check_national_review_evidence.py'
      - 'docs/venue-imports/first-50-municipal-evidence-20261021.json'
      - '.github/workflows/venue-first-50-evidence-offline.yml'
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema and review gates without network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check_national_review_evidence.py
          python3 -m unittest discover -s scripts -p 'test_check_national_review_evidence.py' -v
