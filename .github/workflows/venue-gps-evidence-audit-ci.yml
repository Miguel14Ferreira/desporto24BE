name: Venue GPS source reconciliation (offline)
on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'scripts/audit_live_venue_gps_evidence.py'
      - 'scripts/test_audit_live_venue_gps_evidence.py'
      - 'docs/venue-imports/viseu-guarda-3-municipal-gps-pending-caop2025.json'
      - 'docs/venue-imports/braga-evora-2-official-site-gps-review-20261021.json'
      - 'docs/venue-imports/santarem-pavilhao-gps-source-conflict-20261027.json'
      - 'docs/venue-imports/porto-outeiro-osm-geometry-review-20261027.json'
      - '.github/workflows/venue-gps-evidence-audit-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate eight GPS evidence points, Outeiro geometry risk and no approvals
        run: python3 -m unittest discover -s scripts -p test_audit_live_venue_gps_evidence.py -v
