name: Mem Ramires draft venue PostgreSQL16 and read-only LIVE preflight

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - 'src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-santarem-mem-ramires-DRAFT.sql'
      - 'src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-santarem-mem-ramires-PREFLIGHT-READONLY.sql'
      - '.github/workflows/venue-mem-ramires-draft-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: venues_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venues_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: venues_test
      PGUSER: postgres
      PGPASSWORD: local_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable PostgreSQL 16 venue schema
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255),
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            website VARCHAR(255),
            contact VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE (information_source,source_reference)
          );
          SQL
      - name: Insert draft twice and test nullable contact, no duplicate
        run: |
          set -euo pipefail
          SQL=src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-santarem-mem-ramires-DRAFT.sql
          psql -v ON_ERROR_STOP=1 -f "$SQL"
          psql -v ON_ERROR_STOP=1 -f "$SQL"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 1 THEN
              RAISE EXCEPTION 'Draft must insert once and be idempotent';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM desporto24.venue
                           WHERE name = 'Pavilhão da EB 2/3 Mem Ramires'
                             AND contact IS NULL
                             AND latitude IS NULL AND longitude IS NULL
                             AND information_source = 'OFFICIAL'
                             AND sports LIKE '%Badminton%') THEN
              RAISE EXCEPTION 'No-phone official venue contract failed';
            END IF;
          END $$;
          SQL
      - name: Simulated preexisting alternate name at same address prevents duplicate
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE TABLE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name, city, district, address, information_source, created_at)
          VALUES ('Pavilhão da Escola Mem Ramires', 'Santarém', 'Santarém',
                  'Rua Doutor Virgílio Arruda, 2000-217 Santarém',
                  'COMMUNITY', CURRENT_TIMESTAMP);
          SQL
          psql -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-santarem-mem-ramires-DRAFT.sql
          test "$(psql -At -c 'SELECT COUNT(*) FROM desporto24.venue')" = "1"
          psql -v ON_ERROR_STOP=1 -c "SELECT name FROM desporto24.venue WHERE information_source='COMMUNITY'"
          psql -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-santarem-mem-ramires-PREFLIGHT-READONLY.sql
      - name: Verify public catalogue still has no Mem Ramires name/street (GET only)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from audit_venue_public_contacts import load_public_catalogue
          from audit_municipal_expansion_candidates import normalized
          venues = load_public_catalogue()
          review = [v["id"] for v in venues
                    if normalized(v.get("city")) == "santarem"
                    and ("ramires" in normalized(v.get("name"))
                         or "virgilio arruda" in normalized(v.get("address")))]
          print(f"LIVE public catalogue total: {len(venues)}; Mem Ramires name/street candidates: {review}")
          if review:
              raise SystemExit("Existing public venue candidate requires manual review; no release")
          PY
          echo 'Test fixture only: no production writes, no deploy and no contact import.'
