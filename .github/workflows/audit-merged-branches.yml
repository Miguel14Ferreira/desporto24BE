name: Clean safely merged old branches
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test branch cleanup safety
        run: python3 -m unittest discover -s scripts -p 'test_safe_merged_branch_cleanup.py'
      - name: Remove eligible branches with preserved ancestry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_BRANCH: develop
          MIN_AGE_DAYS: '3'
          DRY_RUN: 'true'
        run: python3 scripts/safe_merged_branch_cleanup.py
