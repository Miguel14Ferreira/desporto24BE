name: Archive every verified fully merged branch (recoverable)
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/archive-pinned-merged-20261102.yml']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: archive-pinned-merged-20261102
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit and archive merged branches with recovery tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,urllib.request,urllib.error,urllib.parse
          repo=os.environ['REPO']
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=30) as res:
                  body=res.read()
                  return json.loads(body) if body else {}
          protected={'develop','master','main','preview/render-fullstack','feature/desporto24-preview-deploy'}
          protected_prefix=('release/','backup/','archive/','dependabot/')
          developsha=api('GET','/git/ref/heads/develop')['object']['sha']
          refs=subprocess.check_output(['git','for-each-ref','--format=%(refname:short) %(objectname)','refs/remotes/origin'],text=True).splitlines()
          candidates=[]
          for line in refs:
              full,sha=line.strip().split(' ',1)
              if not full.startswith('origin/'): continue
              name=full[len('origin/'):]
              if name in protected or name.startswith(protected_prefix) or name=='HEAD': continue
              if not re.fullmatch(r'[A-Za-z0-9._/-]+',name) or '..' in name: continue
              if subprocess.run(['git','merge-base','--is-ancestor',sha,developsha],check=False).returncode==0:
                  candidates.append((name,sha))
          print('MERGED_CANDIDATES',len(candidates),'ALL_REFS',len(refs))
          archived=0
          for name,sha in candidates:
              if archived>=100: break
              enc=urllib.parse.quote(name,safe='/')
              try:
                  current=api('GET','/git/ref/heads/'+enc)
              except urllib.error.HTTPError as e:
                  if e.code==404: continue
                  raise
              if current['object']['sha']!=sha:
                  print('SKIP_MOVED',name)
                  continue
              cmp=api('GET','/compare/'+developsha+'...'+sha)
              if cmp['ahead_by']!=0 or cmp['status'] not in ('behind','identical'):
                  print('SKIP_DIVERGENT',name)
                  continue
              prs=api('GET','/pulls?state=open&head='+urllib.parse.quote(repo.split('/')[0]+':'+name,safe='')+'&per_page=100')
              if prs:
                  print('SKIP_OPEN_PR',name)
                  continue
              tag='archive/merged-sweep-20261102/'+name
              tagpath=urllib.parse.quote(tag,safe='/')
              try:
                  original=api('GET','/git/ref/tags/'+tagpath)
                  assert original['object']['sha']==sha,'Archive tag SHA mismatch: '+name
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
                  api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
              assert api('GET','/git/ref/tags/'+tagpath)['object']['sha']==sha
              assert api('GET','/git/ref/heads/'+enc)['object']['sha']==sha
              api('DELETE','/git/refs/heads/'+enc)
              archived+=1
              print('ARCHIVED_AND_DELETED',name,sha)
          print('ARCHIVED_TOTAL',archived)
          PY
