name: Portalegre 33-venue catalogue gap audit

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - 'scripts/audit_portalegre_expansion_candidates.py'
      - 'scripts/test_audit_portalegre_expansion_candidates.py'
      - 'docs/venue-imports/portalegre-2026-10-19-batch2-corroborated.json'
      - 'docs/venue-imports/portalegre-11-municipal-sources-20261019.json'
      - 'docs/venue-imports/portalegre-2026-10-19-source-review.json'
      - '.github/workflows/portalegre-venue-expansion-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source, duplicate and fail-closed tests
        run: |
          python3 -m py_compile scripts/audit_portalegre_expansion_candidates.py
          python3 -m unittest discover -s scripts -p 'test_audit_portalegre_expansion_candidates.py' -v
      - name: GET public Jynlo LIVE catalogue once and compare 33 candidates
        run: |
          mkdir -p /tmp/jynlo-portalegre-readonly
          python3 scripts/audit_portalegre_expansion_candidates.py \
            --live-public-api \
            --output-json /tmp/jynlo-portalegre-readonly/portalegre-candidate-review.json
      - name: Keep JSON report 7 days, no phones or credentials
        uses: actions/upload-artifact@v4
        with:
          name: portalegre-33-public-candidate-review
          path: /tmp/jynlo-portalegre-readonly/portalegre-candidate-review.json
          retention-days: 7
