name: Castelo Branco and Alcains draft venues - PostgreSQL16

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - 'src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-castelo-branco-alcains-DRAFT.sql'
      - 'src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-castelo-branco-alcains-PREFLIGHT-READONLY.sql'
      - 'docs/venue-imports/2026-10-26-castelo-branco-alcains-DRAFT.md'
      - '.github/workflows/venue-castelo-branco-alcains-draft-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: venues_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venues_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: venues_test
      PGUSER: postgres
      PGPASSWORD: local_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Isolated PostgreSQL16 venue schema
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL, city VARCHAR(120) NOT NULL,
            district VARCHAR(120), address VARCHAR(255), sports VARCHAR(255),
            venue_type VARCHAR(80), environment_type VARCHAR(20),
            latitude DOUBLE PRECISION, longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255), website VARCHAR(255), contact VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE, lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE (information_source, source_reference)
          );
          SQL
      - name: Double-run SQL draft (idempotent and contact optional)
        run: |
          set -euo pipefail
          SQL=src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-castelo-branco-alcains-DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f "$SQL"
          psql -X -v ON_ERROR_STOP=1 -f "$SQL"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 2 THEN
              RAISE EXCEPTION 'Exactly two new venues expected after double apply';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE contact IS NULL AND latitude IS NULL AND longitude IS NULL) <> 2 THEN
              RAISE EXCEPTION 'Phone and GPS must be optional for both';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM desporto24.venue
                           WHERE name = 'Complexo de Piscinas Municipais de Alcains'
                             AND address IS NULL AND environment_type='BOTH') THEN
              RAISE EXCEPTION 'Unknown Alcains street must not be invented';
            END IF;
          END $$;
          SQL
      - name: Duplicate names and community aliases stay unchanged
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name, city, district, address, information_source, created_at)
          VALUES
            ('Pavilhão Municipal', 'Castelo Branco', 'Castelo Branco',
             'Avenida Rotary, 6000-087 Castelo Branco', 'COMMUNITY', CURRENT_TIMESTAMP),
            ('Piscina Praia de Alcains', 'Alcains', 'Castelo Branco',
             NULL, 'OPENSTREETMAP', CURRENT_TIMESTAMP);
          SQL
          psql -X -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-castelo-branco-alcains-DRAFT.sql
          test "$(psql -X -At -c 'SELECT COUNT(*) FROM desporto24.venue')" = "2"
          psql -X -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-castelo-branco-alcains-PREFLIGHT-READONLY.sql
      - name: Read-only complete LIVE public catalogue alias scan
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from audit_venue_public_contacts import load_public_catalogue
          from audit_municipal_expansion_candidates import normalized
          venues=load_public_catalogue()
          cb=[]
          alcains=[]
          for venue in venues:
              name=normalized(venue.get("name"))
              city=normalized(venue.get("city"))
              addr=normalized(venue.get("address"))
              if city=="castelo branco" and ("pavilh" in name or "rotary" in addr):
                  cb.append((venue["id"], venue.get("name")))
              if (("alcains" in name and ("piscin" in name or "aquatic" in name))
                    or (city=="alcains" and "piscin" in name)):
                  alcains.append((venue["id"], venue.get("name")))
          print("LIVE catalogue count:",len(venues))
          print("Potential Castelo Branco pavilion aliases:",cb[:12])
          print("Potential Alcains pool aliases:",alcains[:12])
          if cb or alcains:
              raise SystemExit("Potential duplicate venue: hold draft for manual review")
          PY
          echo "PASS: No candidate alias in full public LIVE catalogue (not a DB preflight)"
