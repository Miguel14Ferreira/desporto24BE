name: Braganca two pavilion site preflight (read-only)

on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'scripts/audit_braganca_two_pavilions_20261028.py'
      - 'scripts/test_audit_braganca_two_pavilions_20261028.py'
      - 'docs/venue-imports/braganca-pavilions-two-sites-review-20261028.json'
      - 'docs/venue-imports/braganca-pavilions-two-sites-runbook-20261028.md'
      - '.github/workflows/braganca-two-pavilions-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sports-hall-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test manifest, geography, privacy and anti-duplicate rules
        run: python3 -m unittest discover -s scripts -p 'test_audit_braganca_two_pavilions_20261028.py' -v
      - name: Read only the fixed public Jynlo catalogue
        run: |
          set -euo pipefail
          mkdir -p .cache/jynlo-braganca-pavilions
          python3 scripts/audit_braganca_two_pavilions_20261028.py \
            --live-public-api \
            --out .cache/jynlo-braganca-pavilions/site-review.json
          echo "Braganca two pavilions - $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
          echo "Review only. GPS points are not verified entrances; no import authorized." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep report for three days
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-braganca-two-pavilions-review
          path: .cache/jynlo-braganca-pavilions/site-review.json
          retention-days: 3
          if-no-files-found: error
