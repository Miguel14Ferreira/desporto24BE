name: Jynlo tournament event type contract CI
on:
  push:
    branches: [develop]
    paths:
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournament.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CreateCommunityTournamentRequest.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityTournamentResponse.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentEventType.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentMeasuredService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityMeasuredStandings.java'
      - 'src/main/java/com/example/desporto24/controllers/CommunityTournamentMeasuredController.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityMeasuredStandingResponse.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityTournamentMeasuredOverviewResponse.java'
      - 'src/test/java/com/example/desporto24/service/CommunityMeasuredStandingsTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentMeasuredServiceTest.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentTimedService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTimedStandings.java'
      - 'src/main/java/com/example/desporto24/controllers/CommunityTournamentTimedController.java'
      - 'src/main/java/com/example/desporto24/enumeration/TournamentScoringMode.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentRelayService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityRelayStandings.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentRelayHeat.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentRelayFinalist.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentRelayDecision.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentRelayFinalistRepository.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentRelayDecisionRepository.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityRelayOverviewResponse.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityRelayHeatResponse.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityRelayFinalistResponse.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityRelayDecisionRequest.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityRelayDecisionResponse.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentRelayHeatRepository.java'
      - 'src/main/java/com/example/desporto24/controllers/CommunityTournamentRelayController.java'
      - 'src/test/java/com/example/desporto24/service/CommunityRelayStandingsTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentRelayServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentTimedServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTimedStandingsTest.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentRaceService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityRoundEventType.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentRaceServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityRoundEventTypeTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentServiceTest.java'
      - 'src/main/resources/db/changelog/**'
      - '.github/workflows/jynlo-tournament-event-type-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate tournament request, DTO, persistence and event contracts
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp -Dtest=CommunityTournamentServiceTest,CommunityTournamentControllerTest,CommunityTournamentPersistenceTest,CommunityTournamentTimedServiceTest,CommunityTimedStandingsTest,CommunityFieldDisciplinesTest,CommunityMeasuredStandingsTest,CommunityTournamentMeasuredServiceTest,CommunityRelayStandingsTest,CommunityTournamentRelayServiceTest,CommunityTournamentRaceServiceTest,CommunityRoundEventTypeTest test
