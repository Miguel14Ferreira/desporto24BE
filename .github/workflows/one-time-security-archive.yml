name: One-time verified security archive
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive and delete exact-identical branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_BRANCH: feature/desporto24-preview-deploy
          CANDIDATES: security/profile-password-writeonly-20261024,security/revoke-other-devices-20261025,release/post-game-rating-attended-only-live-20261022
        run: python3 scripts/cleanup_verified_qa_candidates.py
