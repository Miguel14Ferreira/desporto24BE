name: Notification preferences real JWT and HTTP - isolated PostgreSQL 16
# Opt-in, scoped QA. Never uses production accounts, database or Resend.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/test/java/com/example/desporto24/service/NotificationPreferencesAuthenticatedPgIT.java'
      - '.github/workflows/notification-preferences-authenticated-pg16.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-auth-pg16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-notifications:
    name: Real JWT + HTTP, fictional users and disposable PostgreSQL 16
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notification_auth_qa
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d notification_auth_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      JYNLO_TEST_PG_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/notification_auth_qa
      JYNLO_TEST_PG_USERNAME: qa
      JYNLO_TEST_PG_PASSWORD: local_only
      UI_APP_URL: http://127.0.0.1:4200
      VERIFY_EMAIL_HOST: http://127.0.0.1:8080
      AES_ENCRYPTION_KEY: ciKey1
      JWT_SECRET: isolated_jynlo_notification_jwt_contract_key_2026
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: notification_auth_qa
      POSTGRES_USERNAME: qa
      POSTGRES_PASSWORD: local_only
      POSTGRES_SCHEMA: desporto24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create isolated PostgreSQL schema
        env:
          PGPASSWORD: local_only
        run: psql -h 127.0.0.1 -U qa -d notification_auth_qa -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA desporto24 AUTHORIZATION qa'
      - name: Verify real signed JWT, notification preferences and unread endpoint
        run: bash ./mvnw -B -ntp -Dtest=NotificationPreferencesAuthenticatedPgIT test
