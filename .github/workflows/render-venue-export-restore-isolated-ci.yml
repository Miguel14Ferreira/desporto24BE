name: Verify Render export restore into offline PostgreSQL 16

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - 'scripts/verify_render_venue_export_restore.sh'
      - '.github/workflows/render-venue-export-restore-isolated-ci.yml'
      - 'docs/venue-imports/render-export-restore-runbook-20261026.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: venues_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venues_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: venues_fixture
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and help text without network
        run: |
          set -euo pipefail
          bash -n scripts/verify_render_venue_export_restore.sh
          bash scripts/verify_render_venue_export_restore.sh --help
          if bash scripts/verify_render_venue_export_restore.sh /tmp/nonexistent.dir.tar.gz; then
            echo "FAIL: nonexistent backup accepted"; exit 1
          fi
      - name: Create synthetic Jynlo schema (no real user data)
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL
          );
          CREATE TABLE desporto24.databasechangelog (id VARCHAR(255) NOT NULL);
          INSERT INTO desporto24.databasechangelog (id) VALUES ('test-only-changelog');
          INSERT INTO desporto24.venue (name, city)
          SELECT 'Sintético ' || value, 'Cidade Teste'
          FROM generate_series(1, 3595) AS value;
          SQL
          mkdir -p "$RUNNER_TEMP/jynlo-restore-fixture"
      - name: Create test-only Render-format .dir.tar.gz archive via PG16
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=disposable_ci_only \
            -v "$RUNNER_TEMP/jynlo-restore-fixture:/out" \
            postgres:16 bash -euc '
              pg_dump -h 127.0.0.1 -U postgres -d venues_fixture \
                --format=directory --no-owner --no-privileges \
                -f /out/synthetic_pg16
              tar -czf /out/synthetic_venue_backup.dir.tar.gz -C /out synthetic_pg16
              chmod a+r /out/synthetic_venue_backup.dir.tar.gz
            '
          test -s "$RUNNER_TEMP/jynlo-restore-fixture/synthetic_venue_backup.dir.tar.gz"
      - name: Prove custom Render export can be fully restored offline
        run: |
          set -euo pipefail
          JYNLO_RESTORE_EXPECTED_VENUES=3595 \
            bash scripts/verify_render_venue_export_restore.sh \
              "$RUNNER_TEMP/jynlo-restore-fixture/synthetic_venue_backup.dir.tar.gz"
      - name: Reject corrupt and structurally invalid backup files
        run: |
          set -euo pipefail
          printf 'not a PostgreSQL backup' > "$RUNNER_TEMP/jynlo-restore-fixture/corrupt.dir.tar.gz"
          if bash scripts/verify_render_venue_export_restore.sh \
            "$RUNNER_TEMP/jynlo-restore-fixture/corrupt.dir.tar.gz" >/dev/null 2>&1; then
            echo "FAIL: corrupt .dir.tar.gz was accepted"; exit 1
          fi
          if JYNLO_RESTORE_EXPECTED_VENUES=0 \
            bash scripts/verify_render_venue_export_restore.sh \
              "$RUNNER_TEMP/jynlo-restore-fixture/synthetic_venue_backup.dir.tar.gz" >/dev/null 2>&1; then
            echo "FAIL: invalid minimum count was accepted"; exit 1
          fi
          echo "PASS: corrupt archives and invalid minima fail safely"
      - name: Verify no real database connection or external backup upload
        run: |
          set -euo pipefail
          ! grep -qE 'RENDER_API_KEY|POSTGRES_HOST|POSTGRES_PASSWORD|api.d24sports.com' \
            scripts/verify_render_venue_export_restore.sh
          echo "PASS: no production secrets, network, or real backup uploaded"
