name: World Skate 2026 isolated PostgreSQL 16 test
# A disposable GitHub Actions service, never Render / production.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/test/java/com/example/desporto24/service/CommunityInlineSpeedPostgres16Test.java'
      - 'src/main/resources/db/changelog/changes/2026-10-25-inline-speed-progression-v1.yaml'
      - 'src/main/resources/db/changelog/changes/2026-10-25-inline-speed-jury-tiebreak-v1.yaml'
      - 'src/main/resources/db/changelog/changes/2026-10-25-inline-speed-jury-tiebreak-revisions-v1.yaml'
      - 'src/main/resources/db/changelog/changes/2026-10-25-inline-speed-jury-evidence-v1.yaml'
      - '.github/workflows/inline-speed-postgres16-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: speed-pg16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pg16-contract:
    name: Fictional skaters and actual PostgreSQL constraints
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inline_speed_qa
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d inline_speed_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AES_ENCRYPTION_KEY: ciKey1
      JYNLO_TEST_PG_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/inline_speed_qa
      JYNLO_TEST_PG_USERNAME: qa
      JYNLO_TEST_PG_PASSWORD: local_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run actual inline-speed migration and relational integrity QA
        run: bash ./mvnw -B -ntp -Dtest=CommunityInlineSpeedPostgres16Test test
