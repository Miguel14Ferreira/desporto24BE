name: Municipal next batch PostgreSQL 16 fixture audit
on:
  push:
    branches: ['release/venues-leiria-setubal-braganca-20261021']
    paths:
      - '.github/workflows/venue-municipal-next-20261021-ci.yml'
      - 'src/main/resources/db/changelog/changes/2026-10-21-municipal-setubal-leiria-braganca-staged.*'
      - 'src/main/resources/db/changelog/venue-imports/preflight-municipal-next-20261021-READONLY.sql'
permissions:
  contents: read
jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      db:
        image: postgres:16
        env: {POSTGRES_DB: venues_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: local_fixture_only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d venues_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: {PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: local_fixture_only, PGDATABASE: venues_test}
    steps:
      - uses: actions/checkout@v4
      - name: Fixture and SQL replay (nothing connects to Render)
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL, city VARCHAR(120) NOT NULL,
            district VARCHAR(120), address VARCHAR(255) NOT NULL,
            sports VARCHAR(255), venue_type VARCHAR(80), environment_type VARCHAR(20),
            latitude DOUBLE PRECISION, longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255), website VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE(information_source,source_reference)
          );
          INSERT INTO desporto24.venue(name,city,district,address,information_source,created_at)
          VALUES ('Pista Municipal de BMX de Setúbal','Setúbal','Setúbal',
                  'Morada adicionada pelo utilizador','COMMUNITY',now());
          SQL
          QUERY=src/main/resources/db/changelog/venue-imports/preflight-municipal-next-20261021-READONLY.sql
          psql -v ON_ERROR_STOP=1 -f "$QUERY" > /tmp/preflight.txt
          grep -F 'SAME_NAME_CITY_REVIEW' /tmp/preflight.txt
          SQLFILE=src/main/resources/db/changelog/changes/2026-10-21-municipal-setubal-leiria-braganca-staged.sql
          psql -v ON_ERROR_STOP=1 -f "$SQLFILE" >/dev/null
          count="$(psql -At -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM desporto24.venue')"
          test "$count" = '32'
          psql -v ON_ERROR_STOP=1 -f "$SQLFILE" >/dev/null
          test "$(psql -At -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM desporto24.venue')" = "$count"
          test "$(psql -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM desporto24.venue WHERE information_source='OFFICIAL'")" = '31'
          test "$(psql -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM desporto24.venue WHERE address='Morada adicionada pelo utilizador' AND information_source='COMMUNITY'")" = 1
          echo "PASS: 31 conditional inserts, one existing community alias preserved, repeat idempotent."
