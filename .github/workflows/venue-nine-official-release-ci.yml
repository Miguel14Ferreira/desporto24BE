name: Nine official venues Liquibase PG16 release gate

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - '.github/workflows/venue-nine-official-release-ci.yml'
      - 'src/main/resources/db/changelog/changes/2026-10-26-nine-official-venues.*'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liquibase-nine-venues:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: isolated_nine_venue_release
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_venue_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isolated_nine_venue_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: isolated_nine_venue_release
      PGUSER: postgres
      PGPASSWORD: test_only_venue_release
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
      - name: Check only one intended Liquibase master registration
        shell: bash
        run: |
          set -euo pipefail
          master=src/main/resources/db/changelog/db.changelog-master.yaml
          sql=src/main/resources/db/changelog/changes/2026-10-26-nine-official-venues.sql
          yaml=src/main/resources/db/changelog/changes/2026-10-26-nine-official-venues.yaml
          test "$(grep -Fc 'file: db/changelog/changes/2026-10-26-nine-official-venues.yaml' "$master")" = 1
          test "$(grep -c '^INSERT INTO desporto24.venue' "$sql")" = 9
          test "$(grep -c "^  'JYNLO:OFFICIAL:" "$sql")" -ge 1
          ! grep -Eq '(^|[[:space:]])(UPDATE|DELETE|TRUNCATE|DROP|ALTER|GRANT)[[:space:]]+desporto24' "$sql"
          grep -F 'runInTransaction: true' "$yaml"
          echo 'PASS: one master include, nine insert-only SQL statements'
      - name: Build disposable PG16 schema matching release inserts
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255),
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            website VARCHAR(255),
            contact VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE (information_source, source_reference),
            CONSTRAINT ck_venue_address_or_mainland_gps CHECK (
              NULLIF(BTRIM(address), '') IS NOT NULL
              OR (latitude IS NOT NULL AND longitude IS NOT NULL
                  AND latitude BETWEEN 36.8 AND 42.3
                  AND longitude BETWEEN -9.6 AND -6.0)
            )
          );
          SQL
      - name: Execute actual Liquibase YAML twice, with real pg16 rollback semantics
        shell: bash
        run: |
          set -euo pipefail
          cat > src/main/resources/db/changelog/ci-nine-official-venues.yaml <<'YAML'
          databaseChangeLog:
            - include:
                file: changes/2026-10-26-nine-official-venues.yaml
                relativeToChangelogFile: true
          YAML
          run_liquibase () {
            docker run --rm --network host \
              -v "$PWD/src/main/resources/db/changelog:/liquibase/changelog:ro" \
              liquibase:4.33.0 \
              --url=jdbc:postgresql://127.0.0.1:5432/isolated_nine_venue_release?currentSchema=desporto24 \
              --username=postgres --password=test_only_venue_release \
              --default-schema-name=desporto24 \
              --liquibase-schema-name=desporto24 \
              --search-path=/liquibase/changelog \
              --changelog-file=ci-nine-official-venues.yaml \
              update
          }
          run_liquibase
          run_liquibase
      - name: Assert nine identities, territory, no inferred contacts, no repeats
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Expected exactly nine after Liquibase applied twice';
            END IF;
            IF (SELECT COUNT(DISTINCT source_reference) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Nine distinct official sources required';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE district='Açores') <> 2 OR
               (SELECT COUNT(*) FROM desporto24.venue
                WHERE district='Madeira') <> 4 THEN
              RAISE EXCEPTION 'Expected 2 Açores, 4 Madeira, 3 mainland';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE information_source = 'OFFICIAL'
                  AND contact IS NULL AND latitude IS NULL AND longitude IS NULL
                  AND NULLIF(BTRIM(address), '') IS NOT NULL) <> 9 THEN
              RAISE EXCEPTION 'Do not invent phone/GPS; addresses required';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.databasechangelog
                WHERE id='2026-10-26-nine-official-venues-v1') <> 1 THEN
              RAISE EXCEPTION 'Liquibase changeset must execute once';
            END IF;
          END $$;
          SQL
          echo 'PASS: migration applied once, nine venues, zero duplicates after second execution'
      - name: Exercise source alias safeguards using existing community venue fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
             (name, city, district, address, information_source, contact, created_at)
          VALUES
            ('Pavilhão Mem Ramires - comunitário', 'Santarém', 'Santarém',
             'Rua Doutor Virgílio Arruda, 2000-217 Santarém','COMMUNITY','UNCHANGED-1',NOW()),
            ('Pavilhão Municipal de Castelo Branco', 'Castelo Branco', 'Castelo Branco',
             'Morada alternativa comunitária','COMMUNITY','UNCHANGED-2',NOW()),
            ('Piscina da Vila de Alcains', 'Alcains', 'Castelo Branco',
             'Estrada de Santa, 6005-000 Alcains','COMMUNITY','UNCHANGED-3',NOW()),
            ('Piscinas do Funchal', 'Funchal', 'Madeira',
             'Beco dos Álamos, Santo António, Funchal','COMMUNITY','UNCHANGED-4',NOW());
          SQL
          psql -X -v ON_ERROR_STOP=1 \
            -f src/main/resources/db/changelog/changes/2026-10-26-nine-official-venues.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 9 THEN
              RAISE EXCEPTION 'Four aliases + five fresh should total nine';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE information_source='COMMUNITY' AND contact LIKE 'UNCHANGED-%') <> 4 THEN
              RAISE EXCEPTION 'Existing rows must be preserved';
            END IF;
          END $$;
          SQL
          echo 'PASS: preserve existing community venue rows'
      - name: Confirm no production connectivity/backup exposure
        run: |
          set -euo pipefail
          ! grep -Eqi 'RENDER_API_KEY|JYNLO_VENUE_PREFLIGHT_ENABLED|POSTGRES_HOST|api.d24sports.com' \
            src/main/resources/db/changelog/changes/2026-10-26-nine-official-venues.sql
          echo 'PASS: disposable PostgreSQL only; no LIVE credentials, real backup or network access'
