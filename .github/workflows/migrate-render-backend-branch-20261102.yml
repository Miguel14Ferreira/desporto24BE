name: Jynlo migrate backend Render branch pointer to develop (no deploy)
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/migrate-render-backend-branch-20261102.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Render and Git refs, archive old head and switch configuration without deploying
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          render_token=os.getenv('RENDER_API_KEY') or os.getenv('RENDER_TOKEN')
          if not render_token:
              print('RENDER_API_KEY_NOT_CONFIGURED: no branch settings changed',flush=True)
              sys.exit(0)
          repo=os.environ['REPO']
          assert repo=='Miguel14Ferreira/desporto24BE'
          service_id='srv-darsqqgjo6nc739a10v0'
          old='feature/desporto24-preview-deploy'
          def request(method,url,token,data=None):
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'}
              if 'api.github.com' in url:
                  headers['Accept']='application/vnd.github+json'
                  headers['X-GitHub-Api-Version']='2022-11-28'
              req=urllib.request.Request(url,method=method,headers=headers,
                data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=40) as response:
                  payload=response.read()
                  return json.loads(payload) if payload else {}
          def gh(method,path,data=None):
              return request(method,'https://api.github.com/repos/'+repo+path,os.environ['GH_TOKEN'],data)
          def render(method,data=None):
              return request(method,'https://api.render.com/v1/services/'+service_id,render_token,data)
          svc=render('GET')
          assert svc['id']==service_id
          assert svc['repo'].rstrip('/').removesuffix('.git')=='https://github.com/'+repo
          assert svc.get('autoDeploy')=='no' or svc.get('autoDeployTrigger')=='off','Unexpected auto-deploy configuration'
          branch=svc['branch']
          if branch=='develop':
              print('RENDER_ALREADY_USES_DEVELOP',flush=True)
              sys.exit(0)
          assert branch==old,'Render source branch unexpectedly changed'
          previous=gh('GET','/git/ref/heads/'+old)['object']['sha']
          develop=gh('GET','/git/ref/heads/develop')['object']['sha']
          compare=gh('GET','/compare/'+develop+'...'+previous)
          assert compare['ahead_by']==0 and compare['status'] in ('behind','identical'),'Live branch not in develop'
          tag='archive/render-backend-source-before-develop-20261102'
          try:
              assert gh('GET','/git/ref/tags/'+tag)['object']['sha']==previous
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
              gh('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':previous})
          assert gh('GET','/git/ref/tags/'+tag)['object']['sha']==previous
          svc=render('GET')
          assert svc['branch']==old and (svc.get('autoDeploy')=='no' or svc.get('autoDeployTrigger')=='off')
          changed=render('PATCH',{'branch':'develop'})
          assert changed['branch']=='develop'
          after=render('GET')
          assert after['branch']=='develop' and (after.get('autoDeploy')=='no' or after.get('autoDeployTrigger')=='off')
          print('RENDER_BRANCH_POINTER_UPDATED_TO_DEVELOP_NO_DEPLOY',previous,develop,flush=True)
          PY
