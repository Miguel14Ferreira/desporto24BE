name: Archive identical QA branches
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    if: "!contains(github.event.head_commit.message, '[qa archived]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive and delete exact-identical QA branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_BRANCH: feature/desporto24-preview-deploy
          CANDIDATES: qa/specialized-tournament-http-pg16-20261026,qa/tournament-scale-individual-team-20261026
        run: python3 scripts/cleanup_verified_qa_candidates.py
