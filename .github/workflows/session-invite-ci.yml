name: Validate session invitations

on:
  pull_request:
    branches:
      - feature/desporto24-preview-deploy
    paths:
      - 'src/main/java/com/example/desporto24/controller/SessionInviteController.java'
      - 'src/main/java/com/example/desporto24/service/SessionInviteService.java'
      - 'src/main/java/com/example/desporto24/model/session/SessionInvite.java'
      - 'src/main/java/com/example/desporto24/repository/session/SessionInviteRepository.java'
      - 'src/main/java/com/example/desporto24/enumeration/SessionInviteStatus.java'
      - 'src/test/java/com/example/desporto24/service/SessionInviteServiceTest.java'
      - 'src/main/resources/db/changelog/**'
      - '.github/workflows/session-invite-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invitation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run complete backend test suite
        run: bash ./mvnw -B -ntp test
