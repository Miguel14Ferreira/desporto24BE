name: Exact changed-file equivalence audit
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze changed files without modifying branches
        env:
          PRODUCTION_BRANCH: feature/desporto24-preview-deploy
        run: python3 scripts/audit_exact_file_branch_equivalence.py
