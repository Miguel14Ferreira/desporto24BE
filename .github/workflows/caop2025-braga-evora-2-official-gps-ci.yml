name: CAOP2025 Braga/Evora two official site points (audit only)
on:
  push:
    branches: ['audit/venues-braga-evora-official-gps-20261021']
    paths:
      - 'docs/venue-imports/braga-evora-2-official-site-gps-review-20261021.json'
      - '.github/workflows/caop2025-braga-evora-2-official-gps-ci.yml'
permissions:
  contents: read
jobs:
  administrative-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing municipality validator
        run: |
          python -m pip install --disable-pip-version-check geopandas==1.1.2 pyogrio==0.12.1 shapely==2.1.2 pyproj==3.7.2
          python -m unittest discover -s scripts -p 'test_check_caop2025_snid_points.py' -v
      - name: Download official CAOP2025 municipality polygons to ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/caop
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 'https://geo2.dgterritorio.gov.pt/caop/CAOP_Continente_2025-gpkg.zip' -o /tmp/caop/source.zip
          test "$(stat -c '%s' /tmp/caop/source.zip)" -gt 1000000
          unzip -q /tmp/caop/source.zip -d /tmp/caop
      - name: Validate both sites without importing GPS or touching production
        shell: bash
        run: |
          set -euo pipefail
          GPKG="$(find /tmp/caop -type f -iname '*.gpkg' -print -quit)"
          test -n "$GPKG"
          python scripts/check_caop2025_snid_points.py --gpkg "$GPKG" --candidates docs/venue-imports/braga-evora-2-official-site-gps-review-20261021.json --expected-count 2 --output /tmp/caop/report
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/caop/report/caop2025-snid-2-points.json').read_text())
          assert report['summary']['checked_points']==2
          assert report['summary']['caop_municipality_match']==2, report
          assert report['summary']['points_approved_for_import']==0
          assert {(p['caop_municipality'],p['caop_district']) for p in report['points']}=={('Braga','Braga'),('Évora','Évora')}
          assert all(not p['facility_gps_approved'] for p in report['points'])
          print('PASS: two site coordinates inside expected administrative polygons; none approved for production.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: braga-evora-caop2025-review-only
          path: /tmp/caop/report/
          retention-days: 7
          if-no-files-found: error
