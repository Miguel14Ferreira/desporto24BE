name: Validate community tournament API
on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/main/java/com/example/desporto24/controllers/CommunityTournamentController.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentScheduleService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentResultService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentStandingsService.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/*Tournament*.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentRepository.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentParticipantRepository.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentMatchRepository.java'
      - 'src/main/java/com/example/desporto24/enumeration/TournamentParticipantStatus.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentParticipant.java'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/main/resources/db/changelog/changes/2026-10-16-tournament-participant-confirmation.yaml'
      - 'src/test/java/com/example/desporto24/controllers/CommunityTournamentControllerTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentParticipantsTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentScheduleServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentResultServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentStandingsServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentConfirmationTest.java'
      - '.github/workflows/community-tournament-api-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run full backend test suite
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp test
