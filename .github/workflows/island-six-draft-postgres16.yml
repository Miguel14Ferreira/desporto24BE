name: Island six venue draft PostgreSQL16 source-only rehearsal

on:
  pull_request:
    branches: ['feature/desporto24-preview-deploy']
    paths:
      - 'src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-island-six-official-*'
      - 'docs/venue-imports/islands-first-six-release-readiness-20261026.md'
      - '.github/workflows/island-six-draft-postgres16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: venues_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venues_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: venues_test
      PGUSER: postgres
      PGPASSWORD: local_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Test-only schema mirrors real address/GPS check
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255),
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            website VARCHAR(255),
            contact VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE(information_source, source_reference),
            CONSTRAINT ck_venue_address_or_mainland_gps CHECK (
              NULLIF(BTRIM(address), '') IS NOT NULL OR (
                latitude IS NOT NULL AND longitude IS NOT NULL
                AND latitude BETWEEN 36.8 AND 42.3
                AND longitude BETWEEN -9.6 AND -6.0
              )
            )
          );
          SQL
      - name: Apply six draft statements twice, then assert exactly six and zero phones/GPS
        run: |
          set -euo pipefail
          SQL=src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-island-six-official-DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f "$SQL"
          psql -X -v ON_ERROR_STOP=1 -f "$SQL"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 6 THEN
              RAISE EXCEPTION 'Exactly six different island venues required after two runs';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue WHERE
                contact IS NULL AND latitude IS NULL AND longitude IS NULL
                AND NULLIF(BTRIM(address), '') IS NOT NULL) <> 6 THEN
              RAISE EXCEPTION 'All six need verified addresses, no phone or guessed GPS';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue WHERE district='Açores') <> 2
              OR (SELECT COUNT(*) FROM desporto24.venue WHERE district='Madeira') <> 4 THEN
              RAISE EXCEPTION 'Expected two Azores and four Madeira venues';
            END IF;
            IF (SELECT COUNT(DISTINCT source_reference) FROM desporto24.venue) <> 6 THEN
              RAISE EXCEPTION 'Duplicate official source reference';
            END IF;
          END $$;
          SQL
      - name: Existing community alias on same postal address blocks that candidate
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name,city,district,address,information_source,created_at)
          VALUES ('Complexo das Piscinas Olímpicas', 'Funchal', 'Madeira',
                  'Beco dos Álamos, Santo António, Funchal',
                  'COMMUNITY', CURRENT_TIMESTAMP);
          SQL
          psql -X -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-island-six-official-DRAFT.sql
          test "$(psql -X -At -c 'SELECT COUNT(*) FROM desporto24.venue')" = "6"
          psql -X -v ON_ERROR_STOP=1 -f src/main/resources/db/changelog/venue-imports/drafts/2026-10-26-island-six-official-PREFLIGHT-READONLY.sql
          test "$(psql -X -At -c "SELECT COUNT(*) FROM desporto24.venue WHERE information_source='COMMUNITY' AND name='Complexo das Piscinas Olímpicas'")" = "1"
          echo "PASS: existing community record preserved, candidate not duplicated"
      - name: Confirm migration is NOT included by production changelog
        run: |
          set -euo pipefail
          if grep -F '2026-10-26-island-six-official-DRAFT.sql' \
            src/main/resources/db/changelog/db.changelog-master.yaml; then
            echo "ERROR: draft must never auto-run in production"
            exit 1
          fi
          echo "PASS: no production changelog reference; no Render/DB write"
