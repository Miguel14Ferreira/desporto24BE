name: Braganca pavilion DRAFT Liquibase PG16 safety

on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/main/resources/db/changelog/venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.sql'
      - 'src/main/resources/db/changelog/venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.yaml'
      - 'src/main/resources/db/changelog/venue-imports/preflight-braganca-two-pavilions-READONLY.sql'
      - 'docs/venue-imports/braganca-two-pavilions-opt-in-draft-20261028.md'
      - '.github/workflows/braganca-pavilions-draft-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jynlo_braganca_draft
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_pg16_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jynlo_braganca_draft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: jynlo_braganca_draft
      PGUSER: postgres
      PGPASSWORD: ephemeral_pg16_only
    steps:
      - uses: actions/checkout@v4
      - name: Verify no production master include or unsafe DML
        shell: bash
        run: |
          set -euo pipefail
          sql=src/main/resources/db/changelog/venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.sql
          master=src/main/resources/db/changelog/db.changelog-master.yaml
          ! grep -Fq '2026-10-28-braganca-two-pavilions-OPT-IN' "$master"
          test "$(grep -c '^INSERT INTO desporto24.venue' "$sql")" = 2
          test "$(grep -c '^ON CONFLICT DO NOTHING;' "$sql")" = 2
          ! grep -Eqi '^[[:space:]]*(UPDATE|DELETE|TRUNCATE|DROP|ALTER|GRANT)[[:space:]]+' "$sql"
          ! grep -Eq 'RENDER_API_KEY|POSTGRES_HOST|D24_ADMIN_TOKEN' "$sql"
          echo 'PASS: opt-in SQL never registered for auto startup'
      - name: Prepare isolated PG16 schema
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA desporto24;
          CREATE TABLE desporto24.venue (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(140) NOT NULL,
            city VARCHAR(120) NOT NULL,
            district VARCHAR(120),
            address VARCHAR(255),
            sports VARCHAR(255),
            venue_type VARCHAR(80),
            environment_type VARCHAR(20),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            information_source VARCHAR(20) NOT NULL DEFAULT 'COMMUNITY',
            source_reference VARCHAR(255),
            website VARCHAR(255),
            contact VARCHAR(255),
            indoor BOOLEAN NOT NULL DEFAULT FALSE,
            changing_rooms BOOLEAN NOT NULL DEFAULT FALSE,
            parking BOOLEAN NOT NULL DEFAULT FALSE,
            lighting BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMPTZ NOT NULL,
            CONSTRAINT uk_venue_source_reference UNIQUE (information_source,source_reference),
            CONSTRAINT ck_venue_location CHECK (
              NULLIF(BTRIM(address),'') IS NOT NULL
              OR (latitude BETWEEN 36.8 AND 42.3 AND longitude BETWEEN -9.6 AND -6.0)
            )
          );
          SQL
      - name: Test real Liquibase draft twice on disposable PG16
        shell: bash
        run: |
          set -euo pipefail
          migrate() {
            docker run --rm --network host \
              -v "$PWD/src/main/resources/db/changelog:/liquibase/changelog:ro" \
              liquibase:4.33.0 \
              --url=jdbc:postgresql://127.0.0.1:5432/jynlo_braganca_draft?currentSchema=desporto24 \
              --username="$PGUSER" --password="$PGPASSWORD" \
              --default-schema-name=desporto24 --liquibase-schema-name=desporto24 \
              --search-path=/liquibase/changelog \
              --changelog-file=venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.yaml update
          }
          migrate
          migrate
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 2
              OR (SELECT COUNT(DISTINCT source_reference) FROM desporto24.venue) <> 2
              OR (SELECT COUNT(*) FROM desporto24.databasechangelog
                  WHERE id='2026-10-28-braganca-two-pavilions-DRAFT-v1') <> 1 THEN
              RAISE EXCEPTION 'Exactly two inserts and one Liquibase changeset required';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
               WHERE name='Pavilhão Municipal Arnaldo Pereira'
                 AND address='Avenida D. Sancho I, Zona Desportiva, 5300-125 Bragança'
                 AND sports='Futsal;Andebol;Voleibol;Basquetebol;Hóquei em patins') <> 1
              OR (SELECT COUNT(*) FROM desporto24.venue
               WHERE name='Pavilhão Polidesportivo da Coxa'
                 AND address='Rua Padre Benjamim Videira Pires, s/n, 5300-464 Bragança'
                 AND sports='Futsal;Andebol;Voleibol;Basquetebol;Ténis') <> 1 THEN
               RAISE EXCEPTION 'Official municipal regulatory venue data mismatch';
            END IF;
            IF (SELECT COUNT(*) FROM desporto24.venue
                WHERE district='Bragança' AND information_source='OFFICIAL'
                  AND indoor AND contact IS NULL AND website IS NULL
                  AND latitude BETWEEN 41.75 AND 41.85
                  AND longitude BETWEEN -6.85 AND -6.70) <> 2 THEN
              RAISE EXCEPTION 'No contact/website invention or wrong territory';
            END IF;
          END $$;
          SQL
      - name: Existing nearby pools and stadium must survive as distinct
        shell: bash
        run: |
          set -euo pipefail
          sql=src/main/resources/db/changelog/venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name,city,district,address,information_source,contact,latitude,longitude,created_at)
          VALUES
            ('Piscinas Municipais','Bragança','Bragança','Avenida D. Sancho I',
             'COMMUNITY','PRESERVE-POOL',41.8046409,-6.7702977,NOW()),
            ('Estádio Municipal de Bragança','Bragança','Bragança','Avenida D. Sancho I',
             'COMMUNITY','PRESERVE-STADIUM',41.8034202,-6.7703439,NOW());
          SQL
          psql -X -v ON_ERROR_STOP=1 -f "$sql"
          psql -X -v ON_ERROR_STOP=1 -f "$sql"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 4
              OR (SELECT COUNT(*) FROM desporto24.venue
                  WHERE contact LIKE 'PRESERVE-%') <> 2 THEN
              RAISE EXCEPTION 'Two existing separate facilities must be preserved';
            END IF;
          END $$;
          SQL
      - name: Legacy pre-2015 municipal pavilion name WITHOUT GPS blocks duplication
        shell: bash
        run: |
          set -euo pipefail
          sql=src/main/resources/db/changelog/venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name,city,district,address,information_source,contact,latitude,longitude,created_at)
          VALUES
            ('Pavilhão Municipal','Bragança','Bragança',NULL,
             'COMMUNITY','KEEP-RENAMED-PAVILION',41.805258,-6.769586,NOW()),
            ('Pavilhão da Bancada','Bragança','Bragança','Estádio Municipal',
             'COMMUNITY','KEEP-DISTINCT-BANCADA',NULL,NULL,NOW()),
            ('Pavilhão da Coxa','Sé','Bragança','Bairro da Coxa',
             'COMMUNITY','KEEP-COXA',NULL,NULL,NOW());
          SQL
          psql -X -v ON_ERROR_STOP=1 -f "$sql"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 3
             OR (SELECT COUNT(*) FROM desporto24.venue
                 WHERE contact LIKE 'KEEP-%') <> 3 THEN
              RAISE EXCEPTION 'Legacy renamed pavilion or Coxa must not be duplicated, Bancada preserved';
            END IF;
          END $check$;
          SQL
          echo 'PASS: historical municipal name and independent Bancada safely preserved'
      - name: Legacy pavilion without any GPS is still protected
        shell: bash
        run: |
          set -euo pipefail
          sql=src/main/resources/db/changelog/venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name,city,district,address,information_source,contact,latitude,longitude,created_at)
          VALUES
            ('Pavilhão Municipal','Bragança','Bragança','Recinto sem coordenadas',
             'COMMUNITY','KEEP-WITHOUT-GPS',NULL,NULL,NOW());
          SQL
          psql -X -v ON_ERROR_STOP=1 -f "$sql"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 2
             OR (SELECT COUNT(*) FROM desporto24.venue
                 WHERE contact='KEEP-WITHOUT-GPS') <> 1
             OR (SELECT COUNT(*) FROM desporto24.venue
                 WHERE source_reference='JYNLO:OFFICIAL:BRAGANCA:ARNALDO-PEREIRA') <> 0
             OR (SELECT COUNT(*) FROM desporto24.venue
                 WHERE source_reference='JYNLO:OFFICIAL:BRAGANCA:COXA') <> 1 THEN
               RAISE EXCEPTION 'Must block Arnaldo duplicate without GPS but allow distinct Coxa';
            END IF;
          END $check$;
          SQL
          echo 'PASS: no-GPS historic alias blocks Arnaldo alone'
      - name: Existing venue aliases must block inserts, preserving community rows
        shell: bash
        run: |
          set -euo pipefail
          sql=src/main/resources/db/changelog/venue-imports/drafts/2026-10-28-braganca-two-pavilions-OPT-IN.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE desporto24.venue RESTART IDENTITY;
          INSERT INTO desporto24.venue
            (name,city,district,address,information_source,contact,latitude,longitude,created_at)
          VALUES
            ('Pavilhão Municipal','Bragança','Bragança','Rua D. Sancho I',
             'COMMUNITY','PRESERVE-ARNALDO',41.80499,-6.77015,NOW()),
            ('Pavilhão da Coxa','Sé','Bragança','Bairro da Coxa',
             'COMMUNITY','PRESERVE-COXA',NULL,NULL,NOW());
          SQL
          psql -X -v ON_ERROR_STOP=1 -f "$sql"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM desporto24.venue) <> 2
              OR (SELECT COUNT(*) FROM desporto24.venue
                  WHERE contact LIKE 'PRESERVE-%') <> 2 THEN
              RAISE EXCEPTION 'Do not insert duplicates of existing alias rows';
            END IF;
          END $$;
          SQL
          echo 'PASS: zero writes to production; both public facility types and aliases safe'
