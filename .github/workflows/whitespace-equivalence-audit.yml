name: Whitespace-equivalent stale branch audit
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare branch file bodies read-only
        env:
          PRODUCTION_BRANCH: feature/desporto24-preview-deploy
        run: python3 scripts/audit_whitespace_equivalent_branches.py
