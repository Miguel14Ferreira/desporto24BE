name: Desporto24 BE Feature CI
# Release PRs already run the complete Java suite in pr-validation.yml.
# Avoid rerunning Maven + Docker builds on every preview deployment-branch merge.

on:
  push:
    branches:
      - feature/desporto24-relaunch-clean
  pull_request:
    branches:
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      AES_ENCRYPTION_KEY: abc123
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw -q clean test

      - name: Build production container
        run: docker build --tag desporto24-be:ci .
