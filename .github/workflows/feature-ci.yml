name: Desporto24 BE Feature CI

on:
  push:
    branches:
      - feature/desporto24-relaunch
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AES_ENCRYPTION_KEY: abc123
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw -q clean test
