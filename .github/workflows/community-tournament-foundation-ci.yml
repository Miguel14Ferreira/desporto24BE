name: Validate community tournament foundation
on:
  pull_request:
    branches: [feature/desporto24-preview-deploy]
    paths:
      - 'src/main/java/com/example/desporto24/enumeration/TournamentFormat.java'
      - 'src/main/java/com/example/desporto24/enumeration/TournamentStatus.java'
      - 'src/main/java/com/example/desporto24/enumeration/TournamentMatchStatus.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournament.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentParticipant.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentMatch.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentRepository.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentParticipantRepository.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentMatchRepository.java'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/main/resources/db/changelog/changes/2026-10-16-community-tournament-foundation.yaml'
      - 'src/test/java/com/example/desporto24/repository/community/CommunityTournamentPersistenceTest.java'
      - '.github/workflows/community-tournament-foundation-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run full backend test suite
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp test
