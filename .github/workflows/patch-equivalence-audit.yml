name: Read-only patch equivalence branch audit
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit patch equivalence without deleting
        env:
          PRODUCTION_BRANCH: feature/desporto24-preview-deploy
        run: python3 scripts/audit_patch_equivalent_branches.py
