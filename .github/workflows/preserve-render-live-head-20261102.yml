name: Jynlo preserve currently deployed backend source SHA
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/preserve-render-live-head-20261102.yml']
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create and verify archive tag for deployed Render backend commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          assert os.environ['REPO']=='Miguel14Ferreira/desporto24BE'
          repo=os.environ['REPO']
          sha='f0f7fe46ee3fba20338c9017b6a456bcffb97d81'
          tag='archive/render-backend-source-before-develop-20261102'
          def api(method,path,data=None):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+path,
              method=method,headers={
                'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28',
                'Content-Type':'application/json'},
              data=None if data is None else json.dumps(data).encode())
            with urllib.request.urlopen(req,timeout=30) as r:
              d=r.read()
              return json.loads(d) if d else {}
          assert api('GET','/git/ref/heads/feature/desporto24-preview-deploy')['object']['sha']==sha
          develop=api('GET','/git/ref/heads/develop')['object']['sha']
          compare=api('GET','/compare/'+develop+'...'+sha)
          assert compare['ahead_by']==0
          try:
            current=api('GET','/git/ref/tags/'+tag)['object']['sha']
            assert current==sha,'tag SHA mismatch'
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
            api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
          assert api('GET','/git/ref/tags/'+tag)['object']['sha']==sha
          print('RENDER_BACKEND_HEAD_ARCHIVED',sha,tag,flush=True)
          PY
